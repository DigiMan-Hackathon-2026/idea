name: digiman-local

services:
  postgres:
    image: postgis/postgis:17-3.7-alpine@sha256:05c73e6e309fb978eb3555f42e7725fb74a9bdc8ef99fac11397dbbd3edb95bc
    platform: linux/amd64
    environment:
      POSTGRES_DB: ${LOCAL_POSTGRES_DB:-digiman_local}
      POSTGRES_USER: ${LOCAL_POSTGRES_USER:-digiman_migration}
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:?Set LOCAL_POSTGRES_PASSWORD for local development}
    ports:
      - "127.0.0.1:${LOCAL_POSTGRES_PORT:-55434}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
