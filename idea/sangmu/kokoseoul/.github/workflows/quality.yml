name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:17-3.7-alpine@sha256:05c73e6e309fb978eb3555f42e7725fb74a9bdc8ef99fac11397dbbd3edb95bc
        env:
          POSTGRES_DB: digiman_test_ci
          POSTGRES_USER: digiman_migration
          POSTGRES_PASSWORD: ci-local-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U digiman_migration -d digiman_test_ci"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Enable pinned pnpm
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify application and documents
        run: pnpm verify

      - name: Audit moderate-or-higher dependency vulnerabilities
        run: pnpm audit:dependencies

      - name: Mark and migrate integration database
        env:
          APP_ENV: test
          DATABASE_DIRECT_URL: postgresql://digiman_migration:ci-local-only@127.0.0.1:5432/digiman_test_ci
        run: |
          docker exec "${{ job.services.postgres.id }}" psql -U digiman_migration -d postgres -c "comment on database digiman_test_ci is 'digiman:test'"
          pnpm db:migrate

      - name: Configure database capability roles
        run: |
          docker cp scripts/db/configure_roles.sql "${{ job.services.postgres.id }}:/tmp/configure_roles.sql"
          docker exec "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U digiman_migration -d digiman_test_ci -f /tmp/configure_roles.sql
          docker cp scripts/db/configure_test_runtime_login.sql "${{ job.services.postgres.id }}:/tmp/configure_test_runtime_login.sql"
          docker exec "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -v runtime_password=ci-local-only-runtime -U digiman_migration -d digiman_test_ci -f /tmp/configure_test_runtime_login.sql

      - name: Test PostgreSQL constraints
        env:
          APP_ENV: test
          APP_ORIGIN: https://example.test
          DATABASE_URL: postgresql://digiman_runtime_test:ci-local-only-runtime@127.0.0.1:5432/digiman_test_ci
          SESSION_TOKEN_ACTIVE_VERSION: "1"
          SESSION_TOKEN_PEPPERS: '{"1":"ERERERERERERERERERERERERERERERERERERERERERE"}'
          TEST_DATABASE_URL: postgresql://digiman_migration:ci-local-only@127.0.0.1:5432/digiman_test_ci
        run: pnpm test:integration

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run responsive browser flows
        run: pnpm test:e2e
