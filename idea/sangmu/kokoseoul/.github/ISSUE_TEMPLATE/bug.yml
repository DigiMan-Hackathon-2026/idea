name: 버그 보고
description: 재현 가능한 동작 오류와 영향 범위를 기록합니다.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        cookie, token, connection string, 연락처와 자유 입력 원문을 issue에 붙이지 않습니다. 가능한 경우 request ID만 남깁니다.
  - type: dropdown
    id: severity
    attributes:
      label: 심각도
      options:
        - P0 권한·개인정보·데이터 손상
        - P1 핵심 탐색·진행·완료 장애
        - P2 일부 기능·fallback 장애
        - P3 문구·스타일·비핵심 오류
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 환경
      description: commit, local·preview·production, browser·기기, DB schema version을 적습니다.
    validations:
      required: true
  - type: input
    id: request_id
    attributes:
      label: Request ID
      description: 응답에 표시된 ID가 있을 때만 적습니다.
  - type: textarea
    id: steps
    attributes:
      label: 재현 순서
      description: 개인 데이터가 없는 fixture와 단계로 적습니다.
      placeholder: |
        1. Q1 상세를 연다.
        2. 같은 세션에서 두 탭으로 시작한다.
        3. 서로 다른 run ID가 반환된다.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 결과
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 실제 결과
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: 사용자·데이터 영향
      description: 발생 범위, 중복·손실·노출 가능성과 임시 우회 방법을 적습니다.
    validations:
      required: true
  - type: input
    id: acceptance
    attributes:
      label: 관련 AC 또는 계약
      placeholder: AC03, BR02, POST /quests/:questId/runs
  - type: checkboxes
    id: safety
    attributes:
      label: 안전 확인
      options:
        - label: secret, cookie, token과 개인정보를 제거했다.
          required: true
        - label: production 데이터를 재현용으로 복사하지 않았다.
          required: true
