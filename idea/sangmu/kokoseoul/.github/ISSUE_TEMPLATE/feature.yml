name: 기능 작업
description: 사용자 근거와 계약에 연결된 기능 단위를 정의합니다.
title: "[Feature] "
labels:
  - feature
body:
  - type: markdown
    attributes:
      value: |
        구현 계획 F0~F8의 한 책임으로 범위를 좁힙니다. 행사 전 제품 코드 허용 범위가 확인되지 않았다면 구현 issue로 전환하지 않습니다.
  - type: textarea
    id: outcome
    attributes:
      label: 원하는 결과
      description: 사용자가 무엇을 할 수 있게 되는지 적습니다.
      placeholder: 사용자는 일본어로 공개 퀘스트를 필터링하고 추천 이유를 확인할 수 있다.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 사용자·제품 근거
      description: 인터뷰 사건, 결정 기록 또는 스펙 링크를 적습니다.
    validations:
      required: true
  - type: dropdown
    id: workstream
    attributes:
      label: 구현 단위
      options:
        - F0 프로젝트 기반
        - F1 DB와 공통 API
        - F2 공개 퀘스트 탐색
        - F3 익명 방문자 세션
        - F4 진행과 완료
        - F5 나의 기록과 삭제
        - F6 피드백과 신고
        - F7 운영자 인증과 콘텐츠 운영
        - F8 통합 검수와 배포
        - 조사·설계
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 포함 범위
      description: endpoint, 화면, DB와 사용자 상태를 구체적으로 적습니다.
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: 제외 범위
      description: 이번 작업에서 의도적으로 하지 않는 것을 적습니다.
    validations:
      required: true
  - type: input
    id: acceptance
    attributes:
      label: 관련 AC
      description: 예시 AC03, AC05, AC09. 없다면 새 검수 조건을 본문에 적습니다.
      placeholder: AC03, AC05
  - type: textarea
    id: contracts
    attributes:
      label: 영향받는 계약
      description: B2C 스펙, API, 데이터, 화면, 보안, 운영 문서를 적습니다.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      description: 정상·오류·중복·권한·검수 결과를 관찰 가능한 형태로 적습니다.
    validations:
      required: true
  - type: checkboxes
    id: readiness
    attributes:
      label: 착수 확인
      options:
        - label: EVENT_RULES_CHECKLIST의 정확한 gate 값과 근거 commit이 이 작업을 허용한다.
          required: true
        - label: 필요한 선행 결정과 콘텐츠가 준비됐다.
          required: true
        - label: 개인정보·secret·외부 상태 변경 범위를 확인했다.
          required: true
