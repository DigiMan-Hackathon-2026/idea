name: 제품·기술 결정
description: 대안·근거·반대 증거·되돌림 조건이 있는 결정을 기록합니다.
title: "[Decision] "
labels:
  - decision
body:
  - type: markdown
    attributes:
      value: |
        이미 정한 결론을 정당화하기보다 선택해야 할 질문과 대안을 먼저 적습니다. 외부 서비스의 최신 조건은 공식 근거와 확인일을 남깁니다.
  - type: textarea
    id: question
    attributes:
      label: 결정 질문
      description: 하나의 선택만 묻도록 범위를 좁힙니다.
      placeholder: 첫 운영 DB 후보를 어떤 조건에서 채택할 것인가?
    validations:
      required: true
  - type: textarea
    id: trigger
    attributes:
      label: 결정 시점과 선행 조건
      description: 언제 결정해야 하며 아직 기다릴 수 있는 외부 답변·사용자 근거를 적습니다.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: 고정 계약과 제약
      description: 행사 규칙, 개인정보, 비용, 지역, AC, 팀 역량 등 바꿀 수 없는 조건을 적습니다.
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: 비교할 대안
      description: 현상 유지와 보류를 포함해 최소 두 대안의 장점·비용·실패 방식을 적습니다.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 근거와 반대 증거
      description: 공식 source, 익명 사용자 사건, 측정 결과와 확인일을 적습니다. 추론은 사실과 구분합니다.
    validations:
      required: true
  - type: textarea
    id: choice
    attributes:
      label: 현재 제안
      description: 선택 또는 보류와 이유를 적습니다. 아직 결정 전이면 제안이라고 명시합니다.
    validations:
      required: true
  - type: textarea
    id: impacts
    attributes:
      label: 영향 범위
      description: 사용자 흐름, API, DB, 보안, 운영, 비용, 일본어, 접근성과 영향받는 문서를 적습니다.
    validations:
      required: true
  - type: textarea
    id: reversibility
    attributes:
      label: 되돌림·이행 계획
      description: 바꾸기 어려운 데이터·계정·URL과 되돌릴 수 있는 지점, migration·rollback을 적습니다.
    validations:
      required: true
  - type: textarea
    id: revisit
    attributes:
      label: 무효화 조건과 재검토 시점
      description: 어떤 새 근거·가격·성능·사용자 사례가 생기면 결정을 다시 열지 적습니다.
    validations:
      required: true
  - type: checkboxes
    id: completion
    attributes:
      label: 결정 반영 확인
      options:
        - label: 사실·추론·미확인을 구분했다.
          required: true
        - label: 반대 대안과 하지 않기로 한 범위를 남겼다.
          required: true
        - label: 결정 후 스펙·준비도·테스트·운영 문서의 갱신 위치를 정했다.
          required: true
        - label: 외부 상태 변경은 별도 승인·권한 범위를 확인했다.
          required: true
