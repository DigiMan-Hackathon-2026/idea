name: Preview Deploy

# Deploys main to the protected Vercel Preview after the Quality workflow
# passes on a push. The deployment uses the Vercel project's Preview
# environment variables (test-only PostgreSQL), never Production.

on:
  workflow_run:
    workflows:
      - Quality
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: preview-deploy
  cancel-in-progress: true

env:
  VERCEL_CLI: vercel@65.12.1

jobs:
  credentials:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check Vercel credentials
        id: check
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Preview deploy skipped. Add VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID as repository secrets to enable it."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: credentials
    if: needs.credentials.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check out the commit that passed Quality
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version

      - name: Enable pinned pnpm
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pull Vercel Preview settings
        run: pnpm dlx "$VERCEL_CLI" pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build for Vercel Preview
        run: pnpm dlx "$VERCEL_CLI" build --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel Preview
        id: deploy
        run: |
          url="$(pnpm dlx "$VERCEL_CLI" deploy --prebuilt --token="$VERCEL_TOKEN")"
          case "$url" in
            https://*.vercel.app) ;;
            *) echo "::error::Unexpected deployment URL"; exit 1 ;;
          esac
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Summarize preview links
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          {
            echo "## Vercel Preview"
            echo
            echo "- Commit: \`${COMMIT_SHA}\`"
            echo "- Web: ${DEPLOY_URL}/"
            echo "- Mobile frame: ${DEPLOY_URL}/mobile-preview"
            echo
            echo "Sign in with a Vercel account that can open this project's protected previews."
          } >> "$GITHUB_STEP_SUMMARY"
