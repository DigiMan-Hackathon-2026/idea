<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>オミヤゲ・ソウル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Maru+Gothic:wght@400;500;700&family=Gowun+Dodum&family=Gowun+Batang:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FBF5EC; --paper:#FFFDF8; --peach:#F6C3AE; --peach-soft:#FCE3D7;
  --coral:#E8806A; --coral-deep:#D9654E; --sky:#B5D3EF; --sky-deep:#5B8DC0;
  --butter:#F6D27A; --mint:#BFE3CF; --lilac:#D9CDF2;
  --ink:#2B2522; --ink-2:#6B605A; --ink-3:#A59A93; --line:#EFE5D8;
  --r-lg:28px; --r-md:20px; --r-sm:14px;
  --shadow:0 8px 24px rgba(120,80,50,.08), 0 1px 2px rgba(120,80,50,.06);
  --serif:"Shippori Mincho", serif;
  --sans:"Zen Maru Gothic", "Hiragino Maru Gothic ProN", system-ui, sans-serif;
  --ko:"Gowun Dodum", "Apple SD Gothic Neo", sans-serif;
  --spring:cubic-bezier(.34,1.56,.64,1);
}
html[lang="ko"]{ --serif:"Gowun Batang", serif; --sans:"Gowun Dodum","Apple SD Gothic Neo",sans-serif; }
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:#F3E7DA;
  background-image:radial-gradient(circle at 15% 20%,#F9D9C8 0,transparent 40%),radial-gradient(circle at 85% 80%,#DCE8F5 0,transparent 40%);
  font-family:var(--sans);color:var(--ink);
  display:flex;align-items:center;justify-content:center;gap:56px;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:inherit}

/* ---------- desktop side caption ---------- */
.side{max-width:280px}
.side h1{font-family:var(--serif);font-size:40px;line-height:1.15;margin-bottom:14px}
.side p{color:var(--ink-2);font-size:14px;line-height:1.8}
.side .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
.side .chips span{font-size:12px;background:var(--paper);border:1px solid var(--line);padding:6px 10px;border-radius:99px}
@media (max-width:860px){.side{display:none}}

/* ---------- phone ---------- */
.phone{
  width:390px;height:min(844px, calc(100dvh - 32px));min-height:560px;flex:none;background:var(--cream);border-radius:52px;
  border:10px solid #1E1A18;box-shadow:0 40px 80px rgba(60,30,10,.25);
  position:relative;overflow:hidden;display:flex;flex-direction:column;
}
.notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:120px;height:32px;background:#1E1A18;border-radius:20px;z-index:40}
@media (max-width:500px){
  body{display:block;background:var(--cream)}
  .phone{width:100%;height:100dvh;border:0;border-radius:0;box-shadow:none}
  .notch{display:none}
}
.statusbar{height:52px;flex:none;display:flex;justify-content:space-between;align-items:flex-end;padding:0 30px 6px;font-size:13px;font-weight:700}
.screens{flex:1;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;overflow-y:auto;padding:4px 20px 150px;display:none;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.screen.active{display:block}
.screen.go-fwd{animation:slideL .42s cubic-bezier(.2,.8,.2,1)}
.screen.go-back{animation:slideR .42s cubic-bezier(.2,.8,.2,1)}
@keyframes slideL{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}

/* stagger entrance */
.stagger > *{animation:rise .55s var(--spring) both;animation-delay:calc(var(--i,0) * 70ms)}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
.pop-in{animation:popIn .45s var(--spring) both}
@keyframes popIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
.leaving{animation:leave .28s ease forwards}
@keyframes leave{to{opacity:0;transform:translateX(60px) scale(.9);height:0;margin:0;padding:0}}
.bump{animation:bump .3s var(--spring)}
@keyframes bump{50%{transform:scale(1.25)}}
.swap{animation:swap .4s var(--spring)}
@keyframes swap{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
.flip{animation:flip .5s ease}
@keyframes flip{0%{transform:rotateY(0)}50%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}
.fade-lang{animation:fadeLang .35s ease}
@keyframes fadeLang{from{opacity:.2;filter:blur(2px)}to{opacity:1;filter:none}}

/* ---------- common ---------- */
.appbar{display:flex;align-items:center;justify-content:space-between;padding:8px 0 14px;min-height:60px}
.brand{display:flex;align-items:center;gap:6px;font-weight:700;font-size:15px}
.brand .logo svg{width:24px;height:24px;display:block}
.back{width:38px;height:38px;border-radius:50%;background:var(--paper);box-shadow:var(--shadow);display:grid;place-items:center;font-size:20px;transition:transform .2s var(--spring)}
.back:active{transform:scale(.88)}
.step{font-size:12px;color:var(--ink-3);font-weight:700;letter-spacing:.08em}
.h-serif{font-family:var(--serif);font-weight:800;font-size:34px;line-height:1.2;letter-spacing:-.01em}
.h2{font-family:var(--serif);font-weight:800;font-size:26px;line-height:1.3}
.sub{color:var(--ink-2);font-size:13px;margin-top:6px}
.label{font-size:13px;font-weight:700;color:var(--ink-2);margin:22px 0 10px}
.card{background:var(--paper);border-radius:var(--r-md);box-shadow:var(--shadow);padding:16px}
.tabs{display:flex;gap:18px;font-size:13px;font-weight:700;margin-bottom:18px;border-bottom:1px solid var(--line);position:relative}
.tabs button{padding:10px 0;color:var(--ink-3);font-weight:700;display:flex;align-items:center;transition:color .2s}
.tabs button.on{color:var(--ink)}
.tabs .ink{position:absolute;bottom:-1px;height:2px;background:var(--ink);transition:left .3s var(--spring),width .3s var(--spring)}
.tabs .dot{display:inline-grid;place-items:center;min-width:16px;height:16px;border-radius:99px;background:var(--coral);color:#fff;font-size:10px;margin-left:4px;padding:0 4px}
.tabs .dot:empty,.tabs .dot[data-n="0"]{display:none}

.btn{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:56px;border-radius:99px;background:var(--ink);color:#fff;font-weight:700;font-size:16px;transition:transform .2s var(--spring), background .2s;box-shadow:0 10px 24px rgba(43,37,34,.25)}
.btn:active{transform:scale(.96)}
.btn.coral{background:var(--coral);box-shadow:0 10px 24px rgba(232,128,106,.4)}
.btn .arrow{transition:transform .2s}
.btn:hover .arrow{transform:translateX(4px)}
.cta-wrap{position:absolute;left:0;right:0;bottom:86px;padding:0 20px;z-index:8;transition:transform .35s var(--spring),opacity .25s;pointer-events:none}
.cta-wrap .btn{pointer-events:auto}
.cta-wrap.hide{transform:translateY(30px);opacity:0}
.cta-wrap.hide .btn{pointer-events:none}

.chip{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:6px;padding:10px 14px;border-radius:99px;background:var(--paper);border:1.5px solid var(--line);font-size:13px;font-weight:500;transition:background .2s,color .2s,border-color .2s,transform .2s var(--spring);white-space:nowrap}
.chip:active{transform:scale(.92)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.seg{position:relative;display:flex;background:#F1E7DB;border-radius:99px;padding:4px}
.seg button{position:relative;z-index:1;flex:1;height:38px;border-radius:99px;font-size:13px;font-weight:700;color:var(--ink-2);transition:color .2s}
.seg button.on{color:var(--ink)}
.seg .knob{position:absolute;top:4px;bottom:4px;border-radius:99px;background:var(--paper);box-shadow:0 2px 6px rgba(0,0,0,.08);transition:left .35s var(--spring),width .35s var(--spring)}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:ripple .55s ease-out forwards;pointer-events:none}
.chip:not(.on) .ripple{background:rgba(232,128,106,.25)}
@keyframes ripple{to{transform:scale(1);opacity:0}}

/* ---------- language pill ---------- */
.lang{position:absolute;top:66px;right:20px;z-index:12;display:flex;background:var(--paper);border-radius:99px;padding:3px;box-shadow:var(--shadow)}
.lang button{position:relative;z-index:1;font-size:11px;font-weight:700;padding:6px 9px;border-radius:99px;color:var(--ink-3);transition:color .2s}
.lang button.on{color:#fff}
.lang .knob{position:absolute;top:3px;bottom:3px;border-radius:99px;background:var(--ink);transition:left .35s var(--spring),width .35s var(--spring)}

/* ---------- nav ---------- */
.nav{position:absolute;left:12px;right:12px;bottom:14px;height:64px;background:var(--paper);border-radius:24px;box-shadow:0 10px 30px rgba(80,50,30,.12);display:flex;justify-content:space-around;align-items:center;z-index:9}
.nav button{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:700;color:var(--ink-3);flex:1;min-width:0;transition:color .2s}
.nav .ai-tab .ic{width:50px;height:50px;margin-top:-30px;padding:6px 7px 4px;background:var(--paper);border-radius:50%;box-shadow:0 6px 18px rgba(80,50,30,.18);filter:none;opacity:1;transform:none}
.nav .ai-tab.on .ic{box-shadow:0 0 0 3px var(--coral),0 6px 18px rgba(80,50,30,.18);transform:translateY(-3px)}
.nav .ai-tab.on::after{display:none}
.nav button .ic{font-size:20px;line-height:1;filter:grayscale(1);opacity:.55;transition:transform .3s var(--spring),filter .2s,opacity .2s}
.nav button.on{color:var(--ink)}
.nav button.on .ic{filter:none;opacity:1;transform:translateY(-3px) scale(1.15)}
.nav button.on::after{content:"";position:absolute;bottom:-8px;width:5px;height:5px;border-radius:50%;background:var(--coral)}

/* ---------- mascot ---------- */
.mascot svg{display:block;width:100%;height:auto;overflow:visible}
.mascot .bob{animation:bob 2.6s ease-in-out infinite;transform-origin:60px 110px}
.mascot .eye{animation:blink 4s infinite;transform-box:fill-box;transform-origin:center}
.mascot .bow{animation:wiggle 3s ease-in-out infinite;transform-origin:60px 36px}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(2deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.mascot.jump .bob{animation:jump .7s var(--spring) infinite}
@keyframes jump{0%,100%{transform:translateY(0) scale(1,1)}30%{transform:translateY(-18px) scale(.95,1.05)}60%{transform:translateY(0) scale(1.08,.92)}}

/* ---------- home ---------- */
.date{font-size:13px;color:var(--ink-2);margin:6px 0 18px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border-radius:var(--r-md);padding:14px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;text-align:center;transition:transform .25s var(--spring);cursor:pointer}
.tile:hover{transform:translateY(-3px) rotate(-1deg)}
.tile:nth-child(2):hover{transform:translateY(-3px) rotate(1deg)}
.tile .t{font-size:12px;font-weight:700;opacity:.75}
.tile .v{font-family:var(--serif);font-size:32px;font-weight:800}
.tile .u{font-size:12px;font-weight:500}
.tile.sky{background:var(--sky)}
.tile.butter{background:var(--butter)}
.hero{position:relative;margin-top:14px;background:var(--peach-soft);border-radius:var(--r-lg);padding:20px 18px 20px 130px;min-height:150px;overflow:hidden;cursor:pointer}
.hero .mascot{position:absolute;left:8px;bottom:-4px;width:118px}
.hero q{font-family:var(--serif);font-size:17px;font-weight:600;line-height:1.55;quotes:"「" "」";display:block}
html[lang="ko"] .hero q{quotes:"“" "”"}
.hero small{display:block;font-size:12px;color:var(--ink-2);margin-top:8px}
.recent{display:flex;align-items:center;gap:12px;margin-top:10px;cursor:pointer;transition:transform .2s}
.recent:active{transform:scale(.98)}
.recent .ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;flex:none}
.recent b{font-size:14px}
.recent p{font-size:12px;color:var(--ink-3)}
.recent .arrow{margin-left:auto;color:var(--ink-3)}
.fav-item{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.fav-item .pic{width:52px;height:52px;border-radius:16px;background:#F6EEE4;display:grid;place-items:center;font-size:26px;flex:none}
.fav-item b{font-size:14px;display:block}
.fav-item p{font-size:12px;color:var(--ink-3)}

/* ---------- groups ---------- */
.group{position:relative;margin-bottom:12px}
.group .top{display:flex;align-items:center;gap:12px}
.group .emoji{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;font-size:24px;flex:none}
.group .name{font-weight:700;font-size:15px}
.group .meta{font-size:12px;color:var(--ink-3)}
.group .del{margin-left:auto;color:var(--ink-3);font-size:18px;width:32px;height:32px;border-radius:50%;transition:.2s}
.group .del:hover{background:#F6EEE4;color:var(--coral-deep);transform:rotate(90deg)}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.row > span{font-size:13px;color:var(--ink-2);font-weight:500}
.stepper{display:flex;align-items:center;gap:4px;background:#F6EEE4;border-radius:99px;padding:4px}
.stepper button{width:30px;height:30px;border-radius:50%;background:var(--paper);font-size:16px;font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.06);transition:transform .15s var(--spring)}
.stepper button:active{transform:scale(.8)}
.stepper output{min-width:70px;text-align:center;font-weight:700;font-size:14px;display:inline-block}
.add{width:100%;border:2px dashed #E4D6C5;border-radius:var(--r-md);padding:16px;color:var(--ink-2);font-weight:700;font-size:14px;transition:.2s}
.add:hover{border-color:var(--coral);color:var(--coral)}
.sumbar{margin-top:16px;display:flex;justify-content:space-between;align-items:center;background:var(--ink);color:#fff;border-radius:var(--r-md);padding:14px 18px}
.sumbar small{opacity:.7;font-size:11px;display:block}
.sumbar b{font-size:18px}

/* ---------- conditions ---------- */
.datefield{display:flex;align-items:center;justify-content:space-between;background:var(--paper);border-radius:var(--r-sm);padding:12px 14px;box-shadow:var(--shadow)}
.datefield input{border:0;background:none;font-weight:700;outline:none}
.hint{font-size:12px;color:var(--ink-3);margin-top:8px}

/* ---------- results ---------- */
.loader{display:none;flex-direction:column;align-items:center;text-align:center;padding-top:40px}
.loader.show{display:flex}
.loader .mascot{width:140px}
.loader .lt{font-family:var(--serif);font-size:20px;font-weight:700;margin:18px 0 20px}
.loader ul{list-style:none;width:100%;max-width:280px}
.loader li{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--paper);border-radius:var(--r-sm);margin-bottom:8px;font-size:13px;color:var(--ink-3);box-shadow:var(--shadow);transition:color .3s;text-align:left}
.loader li .s{width:20px;height:20px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--coral);flex:none}
.loader li.run{color:var(--ink)}
.loader li.run .s{animation:spin .7s linear infinite}
.loader li.done{color:var(--ink)}
.loader li.done .s{border:0;background:var(--mint);display:grid;place-items:center;animation:popIn .35s var(--spring)}
.loader li.done .s::after{content:"✓";font-size:11px;font-weight:700}
@keyframes spin{to{transform:rotate(360deg)}}
.verify{display:flex;align-items:center;gap:8px;background:var(--mint);border-radius:var(--r-sm);padding:10px 12px;font-size:12px;font-weight:500;margin:14px 0}
.rec{margin-bottom:14px;overflow:hidden;padding:0;position:relative}
.rec .head{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700}
.rec .body{padding:14px 16px 16px;display:flex;gap:14px}
.rec .pic{width:72px;height:72px;border-radius:18px;display:grid;place-items:center;font-size:36px;flex:none;background:#F6EEE4;transition:transform .3s var(--spring)}
.rec:hover .pic{transform:rotate(-6deg) scale(1.05)}
.rec .pname{font-weight:700;font-size:15px;line-height:1.35;padding-right:30px}
.rec .alt-name{font-size:12px;color:var(--ink-3)}
.rec .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.rec .tags span{font-size:10px;padding:3px 8px;border-radius:99px;background:#F6EEE4;color:var(--ink-2);font-weight:700}
.rec .calc{display:flex;justify-content:space-between;align-items:flex-end;padding:0 16px 14px;font-size:13px;color:var(--ink-2)}
.rec .calc b{font-size:18px;color:var(--ink)}
.rec .why{margin:0 16px 16px;background:var(--cream);border-radius:var(--r-sm);padding:10px 12px;font-size:12px;line-height:1.7;color:var(--ink-2)}
.rec .why b{color:var(--ink)}
.rec .alt{display:flex;gap:6px;padding:0 16px 16px;overflow-x:auto;scrollbar-width:none}
.rec .alt button{font-size:11px;padding:6px 10px;border-radius:99px;border:1px solid var(--line);white-space:nowrap;color:var(--ink-2);transition:.2s}
.rec .alt button:hover{border-color:var(--coral);color:var(--coral)}
.heart{position:absolute;right:12px;top:52px;width:34px;height:34px;border-radius:50%;background:var(--paper);box-shadow:var(--shadow);font-size:16px;color:#D8CABB;transition:color .2s}
.heart.on{color:var(--coral)}
.heart.pop{animation:heartPop .45s var(--spring)}
@keyframes heartPop{40%{transform:scale(1.45)}}
.total{background:var(--paper);border-radius:var(--r-md);padding:16px;box-shadow:var(--shadow)}
.total .line{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2);margin:4px 0}
.total .big{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.total .big b{font-family:var(--serif);font-size:28px}
.bar{height:10px;background:#F1E7DB;border-radius:99px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--coral);border-radius:99px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.empty{text-align:center;padding:30px 10px;color:var(--ink-2);font-size:13px;line-height:1.7}
.sample{font-size:10px;color:var(--ink-3);text-align:center;margin-top:14px}

/* ---------- map ---------- */
.map{position:relative;height:210px;border-radius:var(--r-lg);overflow:hidden;background:#EAF1E6;box-shadow:var(--shadow)}
.map svg{width:100%;height:100%;display:block}
.pin{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;transition:transform .3s var(--spring);z-index:1}
.pin.drop{animation:drop .6s var(--spring) both;animation-delay:calc(var(--i) * 120ms)}
@keyframes drop{from{opacity:0;transform:translate(-50%,-180%)}to{opacity:1;transform:translate(-50%,-100%)}}
.pin span{background:var(--paper);border-radius:99px;padding:4px 8px;font-size:10px;font-weight:700;box-shadow:var(--shadow);white-space:nowrap}
.pin i{width:22px;height:22px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);margin-top:4px;border:3px solid #fff;box-shadow:var(--shadow)}
.pin.hl{z-index:3;transform:translate(-50%,-110%) scale(1.25)}
.pin.hl span{background:var(--ink);color:#fff}
.me{position:absolute;left:48%;top:56%;width:16px;height:16px;border-radius:50%;background:var(--sky-deep);border:3px solid #fff}
.me::after{content:"";position:absolute;inset:-3px;border-radius:50%;background:rgba(91,141,192,.35);animation:pulse 1.8s ease-out infinite}
@keyframes pulse{to{transform:scale(3.2);opacity:0}}
.store{display:flex;align-items:center;gap:12px;padding:12px 6px;margin:0 -6px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:12px;transition:background .2s}
.store:last-child{border-bottom:0}
.store:hover,.store.on{background:#F8F0E6}
.store .ico{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-size:20px;flex:none}
.store b{font-size:14px}
.store p{font-size:11px;color:var(--ink-3)}
.store .dist{margin-left:auto;font-size:12px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.phrase-tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;scrollbar-width:none;padding:2px}
.phrase{background:var(--ink);color:#fff;border-radius:var(--r-lg);padding:22px 20px;margin-top:6px;position:relative;overflow:hidden}
.phrase .say{font-size:11px;opacity:.6;font-weight:700;letter-spacing:.04em}
.phrase .kr{font-family:var(--ko);font-size:30px;line-height:1.35;margin:10px 0 8px;word-break:keep-all}
.phrase .yomi{font-size:13px;color:var(--butter);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.phrase .yomi button{color:#fff;background:rgba(255,255,255,.14);padding:4px 10px;border-radius:99px;font-size:12px}
.phrase .ja{font-size:12px;opacity:.7;margin-top:6px}
.phrase .deco{position:absolute;right:-20px;top:-20px;width:110px;height:110px;border-radius:50%;background:rgba(246,210,122,.15);animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.2)}}
.mini{background:var(--paper);border-radius:var(--r-sm);padding:12px 14px;margin-top:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:var(--shadow)}
.mini .kr2{font-family:var(--ko);font-size:16px}
.mini p{font-size:11px;color:var(--ink-3)}
.speak{width:36px;height:36px;border-radius:50%;background:var(--peach-soft);display:grid;place-items:center;flex:none;transition:transform .2s var(--spring)}
.speak:active,.speak.talk{transform:scale(1.2);background:var(--peach)}

/* ---------- message ---------- */
.msg-wrap{perspective:800px}
.msg{position:relative;background:var(--paper);border-radius:var(--r-lg);padding:24px 20px 18px;box-shadow:var(--shadow);margin-top:18px}
.msg .note{font-family:"Shippori Mincho",serif;font-size:20px;line-height:1.7;font-weight:600}
.msg .mean{font-family:var(--ko);font-size:13px;color:var(--ink-2);margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);display:none}
html[lang="ko"] .msg .mean{display:block}
.msg .from{font-size:12px;color:var(--ink-3);margin-top:10px}
.msg .tool{display:flex;gap:8px;margin-top:14px}
.msg .tool button{flex:1;height:40px;border-radius:99px;background:#F6EEE4;font-size:12px;font-weight:700;transition:transform .2s var(--spring)}
.msg .tool button:active{transform:scale(.93)}
.msg .tape{position:absolute;top:-10px;left:50%;transform:translateX(-50%) rotate(-2deg);width:84px;height:22px;background:rgba(246,195,174,.8);border-radius:4px}
.tip{display:flex;gap:10px;align-items:flex-start;background:var(--lilac);border-radius:var(--r-md);padding:14px;margin-top:14px;font-size:12px;line-height:1.7}

/* ---------- checklist ---------- */
.ring{display:flex;align-items:center;gap:18px}
.ring svg{width:96px;height:96px;flex:none}
.ring circle{transition:stroke-dasharray .8s cubic-bezier(.2,.8,.2,1)}
.ring b{font-family:var(--serif);font-size:26px;display:block}
.ring small{color:var(--ink-3);font-size:12px;display:block}
.check{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}
.check:last-child{border:0}
.box{width:26px;height:26px;border-radius:9px;border:2px solid #DCCDBB;display:grid;place-items:center;flex:none;transition:background .2s,border-color .2s;color:transparent;font-size:14px;font-weight:700}
.check.done .box{background:var(--coral);border-color:var(--coral);color:#fff}
.check .t{font-size:14px;font-weight:700;transition:color .3s}
.check.done .t{text-decoration:line-through;color:var(--ink-3)}
.check p{font-size:11px;color:var(--ink-3)}
.check .amt{margin-left:auto;font-size:13px;font-weight:700;white-space:nowrap}
.done-card{display:none;margin-top:14px;text-align:center;background:var(--butter);border-radius:var(--r-md);padding:18px}
.done-card.show{display:block;animation:popIn .5s var(--spring)}
.done-card .mascot{width:90px;margin:0 auto 6px}
.done-card b{font-family:var(--serif);font-size:18px}

/* ---------- sheet ---------- */
.backdrop{position:absolute;inset:0;background:rgba(43,37,34,.35);opacity:0;pointer-events:none;transition:opacity .3s;z-index:20}
.backdrop.show{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--cream);border-radius:28px 28px 0 0;padding:12px 20px 34px;transform:translateY(105%);transition:transform .45s var(--spring);z-index:21}
.sheet.show{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:99px;background:#DCCDBB;margin:0 auto 16px}
.sheet h3{font-family:var(--serif);font-size:20px;margin-bottom:14px}
.preset-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.preset-grid button{background:var(--paper);border-radius:var(--r-md);padding:14px 6px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:700;transition:transform .2s var(--spring)}
.preset-grid button:hover{transform:translateY(-3px)}
.preset-grid button:active{transform:scale(.92)}
.preset-grid .e{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px}

.toast{position:absolute;left:50%;bottom:160px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:99px;font-size:12px;opacity:0;transition:.3s var(--spring);z-index:30;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%)}
.confetti{position:absolute;top:-10px;width:8px;height:12px;border-radius:2px;z-index:35;pointer-events:none;animation:fall 1.6s cubic-bezier(.3,.6,.5,1) forwards}
@keyframes fall{to{transform:translate(var(--dx),900px) rotate(var(--r));opacity:.3}}

/* ---------- AI (mock) ---------- */
.ai-hero{position:relative;margin-top:14px;background:var(--peach-soft);border-radius:var(--r-lg);padding:16px;overflow:hidden}
.ai-badge{position:absolute;top:12px;right:12px;font-size:9px;font-weight:700;letter-spacing:.08em;background:var(--ink);color:#fff;padding:3px 7px;border-radius:99px}
.ai-top{display:flex;gap:8px;align-items:flex-end}
.ai-top .mascot{width:84px;flex:none;margin-bottom:-4px}
.bubble{background:var(--paper);border-radius:18px 18px 18px 4px;padding:10px 12px;font-size:12px;line-height:1.55;box-shadow:var(--shadow);color:var(--ink-2);animation:popIn .5s var(--spring) both .25s;margin-bottom:14px}
.bubble b{display:block;font-family:var(--serif);font-size:15px;color:var(--ink);margin-bottom:2px}
.ai-input{margin-top:12px;width:100%;display:flex;align-items:center;gap:8px;background:var(--paper);border-radius:99px;padding:6px 6px 6px 16px;font-size:13px;color:var(--ink-3);box-shadow:var(--shadow);text-align:left;transition:transform .2s var(--spring)}
.ai-input:active{transform:scale(.97)}
.ai-input #aiPh{flex:1;display:inline-block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.send{width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:16px;flex:none;transition:transform .2s var(--spring)}
.send:active{transform:scale(.85)}
.ai-sugs,.chat-sugs{display:flex;gap:6px;overflow-x:auto;margin-top:10px;scrollbar-width:none;padding-bottom:2px}
.ai-sugs::-webkit-scrollbar,.chat-sugs::-webkit-scrollbar{display:none}
.ai-sugs button,.chat-sugs button{font-size:11px;padding:7px 11px;border-radius:99px;background:rgba(255,255,255,.65);white-space:nowrap;border:1px solid rgba(0,0,0,.05);transition:transform .2s var(--spring)}
.ai-sugs button:active,.chat-sugs button:active{transform:scale(.92)}
.chat-sugs{margin-left:38px;flex-wrap:wrap;overflow:visible;animation:rise .45s var(--spring) both}
.chat-sugs button{background:var(--paper);box-shadow:var(--shadow);border:0}

.chat-head{display:flex;align-items:center;gap:8px}
.chat-head .mascot{width:36px}
.chat-head b{font-size:14px;display:block}
.chat-head small{font-size:11px;color:var(--ink-3);display:flex;align-items:center;gap:4px}
.live{width:7px;height:7px;border-radius:50%;background:#3BB273;display:inline-block}
.chat-log{display:flex;flex-direction:column;gap:10px;padding-top:6px}
.row-bot{display:flex;gap:8px;align-items:flex-end;animation:rise .4s var(--spring) both}
.row-bot .av{width:30px;flex:none}
.bb{max-width:80%;background:var(--paper);border-radius:18px 18px 18px 4px;padding:10px 13px;font-size:14px;line-height:1.65;box-shadow:var(--shadow);white-space:pre-wrap;word-break:break-word}
.row-me{align-self:flex-end;max-width:78%;background:var(--ink);color:#fff;border-radius:18px 18px 4px 18px;padding:10px 13px;font-size:14px;line-height:1.6;animation:rise .35s var(--spring) both;white-space:pre-wrap}
.typing{display:flex;gap:4px;padding:14px 16px}
.typing span{width:7px;height:7px;border-radius:50%;background:var(--ink-3);animation:dot 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{transform:none;opacity:.4}30%{transform:translateY(-5px);opacity:1}}
.caret::after{content:"▍";color:var(--coral);animation:blinkc .7s steps(1) infinite}
@keyframes blinkc{50%{opacity:0}}
.plan{margin-left:38px;background:var(--paper);border-radius:var(--r-md);padding:14px;box-shadow:var(--shadow);animation:popIn .45s var(--spring) both}
.plan h4{font-size:12px;color:var(--ink-3);margin-bottom:4px}
.plan .g{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px}
.plan .g .e{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex:none}
.plan .g b{margin-left:auto;font-size:12px;white-space:nowrap}
.guar{display:flex;gap:4px;flex-wrap:wrap;margin:10px 0 2px}
.guar span{font-size:10px;font-weight:700;padding:4px 8px;border-radius:99px;background:var(--mint)}
.plan .btn{height:46px;font-size:14px;margin-top:10px}
.json-t{font-size:11px;color:var(--ink-3);text-decoration:underline;margin-top:10px;display:block}
.plan pre{display:none;background:var(--ink);color:#EDE8E0;font-size:10px;padding:10px 12px;border-radius:12px;overflow-x:auto;margin-top:8px;line-height:1.55;font-family:ui-monospace,Menlo,monospace}
.plan pre.show{display:block;animation:swap .3s ease}
.plan .note{font-size:10px;color:var(--ink-3);margin-top:6px;line-height:1.5}
.chatbar{position:absolute;left:12px;right:12px;bottom:86px;display:flex;align-items:center;gap:8px;background:var(--paper);border-radius:99px;padding:6px 6px 6px 16px;box-shadow:0 10px 30px rgba(80,50,30,.14);z-index:8;transform:translateY(30px);opacity:0;pointer-events:none;transition:transform .35s var(--spring),opacity .25s}
.chatbar.show{transform:none;opacity:1;pointer-events:auto}
.chatbar input{flex:1;min-width:0;border:0;outline:none;background:none;font-size:14px}
.chatbar{padding-left:8px}
.cb-av{width:34px;flex:none}
.chatbar:focus-within{box-shadow:0 0 0 2px var(--coral),0 10px 30px rgba(80,50,30,.14)}
.ai-form{display:block;margin:12px auto 0;font-size:12px;font-weight:700;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px}
#chatInput.swap{animation:swap .4s var(--spring)}

/* ---------- 土産話 QR (mock) ---------- */
.mcard{position:relative;display:flex;gap:14px;align-items:center;background:var(--paper);border-radius:16px;padding:16px;box-shadow:var(--shadow);aspect-ratio:91/55;border:1px solid var(--line)}
.mcard .tape{position:absolute;top:-9px;right:28px;width:70px;height:20px;background:rgba(246,195,174,.8);border-radius:4px;transform:rotate(3deg)}
.qr{width:96px;flex:none}.qr svg{display:block;width:100%}
.mc-body small{font-size:10px;color:var(--ink-3);letter-spacing:.08em;display:block}
.mc-body b{font-family:"Shippori Mincho",serif;font-size:17px;display:block;margin:6px 0;line-height:1.35}
.mc-body span{font-size:12px;color:var(--ink-2);display:block}
.mc-body em{font-style:normal;font-size:11px;color:var(--coral);font-weight:700;display:block;margin-top:10px}
.photo-pick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ph{aspect-ratio:1;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:6px;gap:2px;color:#fff;border:3px solid transparent;transition:transform .2s var(--spring);background-size:cover;background-position:center}
.ph.up{justify-content:center;padding-bottom:0}
.ph span{font-size:24px}.ph small{font-size:10px;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.3)}
.ph.on{border-color:var(--ink);transform:scale(1.04)}
.ph.up{background:#EEE6DC;color:var(--ink-2)}.ph.up small{text-shadow:none}
.field{background:var(--paper);box-shadow:var(--shadow);border-radius:var(--r-sm);padding:12px 14px;font-size:14px;line-height:1.6}
.hint-inline{font-weight:500;color:var(--ink-3);font-size:11px}
.two-btn{display:flex;gap:8px;margin-top:18px}.two-btn .btn{height:46px;font-size:13px}
.btn.ghost{background:var(--paper);color:var(--ink);box-shadow:var(--shadow)}
.react{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.react:last-child{border:0}
.av2{width:34px;height:34px;border-radius:50%;background:var(--peach-soft);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.react b{font-size:13px}.react p{font-size:12px;color:var(--ink-2)}.react small{margin-left:auto;font-size:11px;color:var(--ink-3)}
.recv-note{font-size:11px;color:var(--ink-3);text-align:center;margin-bottom:10px}
.browser{background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 12px 30px rgba(80,50,30,.14);border:1px solid var(--line)}
.browser .url{font-size:11px;color:var(--ink-3);text-align:center;padding:8px;background:#F4F1EC;border-bottom:1px solid var(--line)}
.rp-top{position:relative}
.rp-hero{height:180px;background:#ddd center/cover no-repeat;position:relative}
.rp-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(255,255,255,.35) 100%)}
.rp-miya{position:absolute;right:10px;top:104px;width:124px;z-index:2;filter:drop-shadow(0 8px 12px rgba(80,50,30,.18))}
.rp-bubble{position:absolute;right:132px;top:120px;z-index:2;background:#fff;border-radius:16px 16px 4px 16px;padding:9px 13px;font-size:12px;font-weight:700;box-shadow:0 6px 16px rgba(80,50,30,.15);animation:popIn .5s var(--spring) both .3s;white-space:nowrap}
.rp-body{padding:18px 16px 16px}
.rp-kicker{font-size:11px;color:var(--ink-3);font-weight:700;letter-spacing:.06em}
.rp-title{font-family:"Shippori Mincho",serif;font-weight:800;font-size:20px;line-height:1.4;margin:4px 120px 14px 0}
html[lang="ko"] .rp-title{font-family:var(--serif)}
.rp-name{display:flex;gap:12px;align-items:center}
.rp-thumb{width:64px;height:64px;border-radius:16px;background:url(assets/yakgwa.jpg) center/cover;flex:none}
.rp-name b{font-size:16px;display:block}.rp-name small{font-size:11px;color:var(--ink-3)}
.rp-desc{font-size:13px;line-height:1.8;color:var(--ink-2);margin:12px 0}
.rp-info{border-top:1px solid var(--line);margin:0}
.rp-info div{display:flex;gap:12px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:12px}
.rp-info dt{width:72px;flex:none;color:var(--ink-3);font-weight:700}.rp-info dd{margin:0;color:var(--ink)}
.rp-msg{margin-top:16px;background:var(--cream);border-radius:16px;padding:14px 16px;position:relative}
.rp-msg small{font-size:11px;color:var(--ink-3);font-weight:700}.rp-msg p{font-family:"Shippori Mincho",serif;font-size:15px;line-height:1.75;margin-top:4px}
html[lang="ko"] .rp-msg p{font-family:var(--serif)}
.rp-ask{text-align:center;font-size:12px;color:var(--ink-2);font-weight:700;margin-top:18px}
.rp-react{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.rf2{width:46px;display:block}
.rf{width:34px;flex:none}
.mc-miya{position:absolute;right:8px;bottom:-10px;width:54px}
.rp-react button{background:var(--cream);border-radius:16px;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;border:2px solid transparent;transition:transform .2s var(--spring),border-color .2s}
.rp-react button span{font-size:10px;font-weight:700;color:var(--ink-2);line-height:1.3;text-align:center}
.rp-react button:active{transform:scale(.9)}
.rp-react button.on{border-color:var(--coral);background:var(--paper);animation:bump .4s var(--spring)}
.rp-foot{text-align:center;font-size:10px;color:var(--ink-3);margin-top:14px}
.push{position:absolute;top:10px;left:10px;right:10px;z-index:45;background:rgba(255,255,255,.95);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:22px;padding:12px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 12px 30px rgba(0,0,0,.18);transform:translateY(-150%);transition:transform .55s var(--spring);cursor:pointer}
.push.show{transform:none}
.push .pi{width:38px;flex:none;background:var(--peach-soft);border-radius:10px;padding:3px}
.push small{font-size:10px;color:var(--ink-3);display:block}.push b{font-size:13px;line-height:1.4;display:block}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>

<body>

<aside class="side">
  <h1 data-i="brandBr"></h1>
  <p data-i="sideDesc"></p>
  <div class="chips" id="sideChips"></div>
</aside>

<div class="phone" id="phone">
  <div class="notch"></div>
  <div class="statusbar"><span>9:41</span><span>●●● ◔</span></div>

  <div class="lang" id="lang"><i class="knob"></i><button data-lang="ja">日本語</button><button data-lang="ko">한국어</button></div>

  <div class="screens">
  <!-- ============ HOME ============ -->
  <section class="screen" id="home">
    <div class="appbar"><div class="brand"><span class="logo" data-mascot="mini"></span><span data-i="brand"></span></div></div>
    <div class="tabs" id="homeTabs">
      <button class="on" data-hometab="prep"><span data-i="tabPrep"></span></button>
      <button data-hometab="fav"><span data-i="tabFav"></span><span class="dot" id="favDot"></span></button>
      <i class="ink"></i>
    </div>
    <div id="homePrep">
      <h1 class="h-serif" data-i="homeTitle"></h1>
      <p class="date" id="today"></p>
      <div class="duo">
        <div class="tile sky" data-go="people"><span class="t" data-i="people"></span><span class="v" id="homePeople">0</span><span class="u" id="homePeopleU"></span></div>
        <div class="tile butter" data-go="people"><span class="t" data-i="budget"></span><span class="v" id="homeBudget">₩0</span><span class="u" id="homeYen"></span></div>
      </div>
      <div class="hero" id="hero">
        <div class="mascot" data-mascot></div>
        <q id="heroQ"></q>
        <small data-i="heroSmall"></small>
      </div>
      <p class="label" data-i="recent"></p>
      <div class="card recent" id="recentCard">
        <div class="ico" style="background:var(--peach-soft)">🎁</div>
        <div><b data-i="recentTitle"></b><p data-i="recentMeta"></p></div><span class="arrow">›</span>
      </div>
    </div>
    <div id="homeFav" style="display:none"></div>
  </section>

  <!-- ============ PEOPLE ============ -->
  <section class="screen" id="people">
    <div class="appbar"><button class="back" data-go="home">‹</button><span class="step">STEP 1 / 2</span><span style="width:96px"></span></div>
    <h2 class="h2" data-i="peopleTitle"></h2>
    <p class="sub" data-i="peopleSub"></p>
    <div id="groupList" style="margin-top:18px"></div>
    <button class="add" id="addGroup" data-i="addGroup"></button>
    <div class="sumbar"><div><small data-i="total"></small><b id="peopleSum"></b></div><div style="text-align:right"><small data-i="budgetGuide"></small><b id="budgetSum"></b></div></div>
  </section>

  <!-- ============ CONDITIONS ============ -->
  <section class="screen" id="cond">
    <div class="appbar"><button class="back" data-go="people">‹</button><span class="step">STEP 2 / 2</span><span style="width:96px"></span></div>
    <div id="condBody">
      <h2 class="h2" data-i="condTitle"></h2>
      <p class="sub" data-i="condSub"></p>
      <div><p class="label" data-i="storage"></p>
        <div class="seg" data-key="storage"><i class="knob"></i><button data-v="room" data-i="room"></button><button data-v="any" data-i="fridgeOk"></button></div></div>
      <div><p class="label" data-i="returnDate"></p>
        <label class="datefield"><span>✈️ <span data-i="returnDate"></span></span><input type="date" id="returnDate"></label>
        <p class="hint" id="shelfHint"></p></div>
      <div><p class="label" data-i="luggage"></p>
        <div class="seg" data-key="luggage"><i class="knob"></i><button data-v="light" data-i="lugLight"></button><button data-v="normal" data-i="lugNormal"></button><button data-v="any" data-i="lugAny"></button></div></div>
      <div><p class="label" data-i="allergyTitle"></p><div class="chips" data-multi="allergy" id="allergyChips"></div></div>
      <div><p class="label" data-i="placeTitle"></p><div class="chips" data-multi="store" id="storeChips"></div></div>
    </div>
  </section>

  <!-- ============ RESULTS ============ -->

function toast(msg){ const el=$('#toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('show'),1700); }
function countUp(el, to, fmt, dur=700){
  const from = +(el.dataset.val || 0); el.dataset.val = to;
  if (from === to){ el.textContent = fmt(to); return; }
  const t0 = performance.now();
  const step = now => { const k = Math.min(1,(now-t0)/dur), e = 1-Math.pow(1-k,3);
    el.textContent = fmt(from + (to-from)*e); if (k<1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function stagger(container, on){
  container.classList.toggle('stagger', !!on);
  [...container.children].forEach((c,i)=>c.style.setProperty('--i', i));
}
function moveKnob(wrap, sel='button.on'){
  const k = wrap.querySelector('.knob'), b = wrap.querySelector(sel); if (!k || !b) return;
  k.style.left = b.offsetLeft+'px'; k.style.width = b.offsetWidth+'px';
}
function speak(text, lang='ko-KR', btn){
  if (!('speechSynthesis' in window)) return toast(t('noVoice'));
  const u = new SpeechSynthesisUtterance(text); u.lang=lang; u.rate=.9;
  if (btn){ btn.classList.add('talk'); u.onend = ()=>btn.classList.remove('talk'); setTimeout(()=>btn.classList.remove('talk'),3000); }
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}

  for (let i=0;i<46;i++){
    const c=document.createElement('span'); c.className='confetti';
    c.style.left=Math.random()*100+'%'; c.style.background=colors[i%colors.length];
    c.style.setProperty('--dx',(Math.random()*160-80)+'px'); c.style.setProperty('--r',(Math.random()*720-360)+'deg');
    c.style.animationDelay=Math.random()*.3+'s'; c.style.animationDuration=1.3+Math.random()*.8+'s';
    ph.appendChild(c); setTimeout(()=>c.remove(),2600);
  }
}

/* ripple on buttons & chips */
document.addEventListener('pointerdown', e=>{
  const b = e.target.closest('.btn, .chip'); if (!b) return;
  const r = b.getBoundingClientRect(), d = Math.max(r.width,r.height)*2, s=document.createElement('span');
  s.className='ripple'; s.style.width=s.style.height=d+'px';
  s.style.left=(e.clientX-r.left-d/2)+'px'; s.style.top=(e.clientY-r.top-d/2)+'px';
  b.appendChild(s); setTimeout(()=>s.remove(),600);
});

/* ================= recommendation =================
   mock of: rule filter (code) → constrained pick (LLM in real app) → verification (code) */
function daysUntilReturn(){
  if (!S.returnDate) return 3;
  return Math.max(0, Math.ceil((new Date(S.returnDate) - new Date()) / 864e5));
}
function candidates(g){
  const minShelf = daysUntilReturn() + 30;
  return DB.filter(p =>
    (S.storage==='any' || p.storage==='room') &&
    !p.allergens.some(a => S.allergy.includes(a)) &&
    p.shelf[0] >= minShelf &&
    p.stores.some(s => S.store.includes(s)) &&
    p.price / p.pack <= g.budget * 1.15 &&
    (g.count <= 3 || p.wrap)
  );
}
function score(p, g){
  let s = -Math.abs(p.formal - g.formal) * 3;
  if (g.count >= 5 && p.tags.includes('share')) s += 3;
  if (S.luggage==='light' && p.tags.includes('light')) s += 2;
  if (p.tags.includes('korean')) s += 1;
  s -= Math.abs(p.price/p.pack - g.budget) / g.budget;
  return s;
}
function reasonFor(p, g){
  const ja = L==='ja', b = [], m = Math.round(p.shelf[0]/30);
  if (p.wrap && g.count>=5) b.push(ja?`個包装なので${g.count}人に配りやすい`:`개별 포장이라 ${g.count}명에게 나눠 주기 좋아요`);
  if (p.storage==='room') b.push(ja?`常温で${m}か月以上もちます`:`상온에서 ${m}개월 이상 보관돼요`);
  if (p.tags.includes('light')) b.push(ja?'軽くてスーツケースの負担が少ない':'가벼워서 캐리어 부담이 적어요');
  if (p.tags.includes('korean')) b.push(ja?'韓国らしさが伝わる':'한국다운 느낌이 전해져요');
  if (p.tags.includes('premium')) b.push(ja?'きちんとした印象を与えられます':'격식 있는 인상을 줘요');
  if (!p.allergens.length) b.push(ja?'主要アレルゲンを含みません':'주요 알레르기 성분이 없어요');
  return b.slice(0,3).join(ja?'。':'. ') + (ja?'。':'.');
}
function recommend(){
  S.recs = S.groups.map(g=>{
    const c = candidates(g).sort((a,b)=>score(b,g)-score(a,g));
    const chosen = c.find(p=>p.id===S.picks[g.id]) || c[0];
    const valid = chosen && DB.some(p=>p.id===chosen.id);            // verify ID exists
    if (!valid) return {g, p:null, alts:[], qty:0, sub:0, spare:0};
    const qty = Math.ceil(g.count / chosen.pack);                    // recompute in code
    return {g, p:chosen, alts:c.slice(0,4), qty, sub:qty*chosen.price, spare:qty*chosen.pack-g.count};
  });
  S.dirty = false;
}

/* ================= Miya-chan AI (mock) =================
   Real app: LLM turns free text into the structured JSON below (function calling / JSON schema).
   Here a small rule-based parser stands in for the LLM. */
function setChatPh(){ $('#chatInput').placeholder = t('chatPh'); }
$('#hero').onclick = ()=>go('people');

const ROLES = [
  {re:/上司|部長|課長|상사|부장|과장|팀장/, name:{ja:'上司',ko:'상사'},e:'👔',color:'var(--lilac)',formal:3,def:1},
  {re:/取引先|거래처/, name:{ja:'取引先',ko:'거래처'},e:'🤝',color:'var(--sky)',formal:3,def:3},
  {re:/同僚|職場|会社|동료|직장|회사|팀원/, name:{ja:'職場の同僚',ko:'직장 동료'},e:'💼',color:'var(--sky)',formal:1,def:10},
  {re:/家族|両親|親|가족|부모|엄마|아빠/, name:{ja:'家族',ko:'가족'},e:'🏠',color:'var(--peach)',formal:2,def:2},
  {re:/友|친구/, name:{ja:'友だち',ko:'친구'},e:'💛',color:'var(--butter)',formal:2,def:1},
];
const ALLERGY_RE = {wheat:/小麦|밀/, milk:/乳製品|牛乳|乳|우유|유제품/, egg:/卵|달걀|계란/, nuts:/ナッツ|견과/, soy:/大豆|대두|콩/, shrimp:/えび|エビ|새우/};
function parseRequest(text){
  let s = text.replace(/[０-９]/g, c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));
  let per = /인당|あたり|ずつ|につき/.test(s);
  s = s.replace(/1\s*(?:人|인|名)\s*(?:あたり|당|につき|ずつ)|1\s*(?:人|名)(?=\s*[₩¥]?\s*\d)/g, ()=>{ per=true; return ' '; });
  let amount = 0;
  s = s.replace(/([₩¥])?\s*(\d[\d,.]*)\s*(万|만|千|천)?\s*(ウォン|원|won|円|엔)?/gi, (m,sym,num,mul,unit)=>{
    if (!sym && !unit && !mul) return m;
    let v = parseFloat(num.replace(/,/g,'')) * ({'万':1e4,'만':1e4,'千':1e3,'천':1e3}[mul]||1);
    if (sym==='¥' || /円|엔/.test(unit||'')) v *= KRW_PER_JPY;
    amount = v; return ' ';
  });
  const groups = []; let orphan = 0;
  s.split(/[、,，。\n]|と|や|그리고|이랑|랑|하고|및/).forEach(seg=>{
    const role = ROLES.find(r=>r.re.test(seg)), num = seg.match(/(\d+)\s*(?:人|명|名)/);
    if (role && !groups.some(g=>g.name.ja===role.name.ja)) groups.push({...role, count: num ? +num[1] : role.def});
    else if (!role && num) orphan = +num[1];
  });
  if (!groups.length && orphan) groups.push({...ROLES[2], count: orphan});
  if (/高級|きちんと|ちゃんと|고급|격식/.test(text)) groups.forEach(g=>g.formal=3);
  if (/気軽|カジュアル|安い|가볍게|저렴/.test(text)) groups.forEach(g=>g.formal=1);
  const people = groups.reduce((a,g)=>a+g.count,0);
  const perBudget = amount ? Math.max(500, Math.round((per ? amount : amount/Math.max(1,people))/500)*500) : 0;
  groups.forEach(g=>{ g.budget = perBudget || {1:2000,2:5000,3:12000}[g.formal]; delete g.re; delete g.def; });
  const allergy = Object.keys(ALLERGY_RE).filter(k=>ALLERGY_RE[k].test(text));
  return {groups, allergy, budgetGiven: !!amount};
}
function summarize(p){
  let s = p.groups.map(g=>t('sumPerson', tx(g.name), g.count)).join(t('sumJoin'));
  if (p.budgetGiven) s += t('sumBudget', won(p.groups[0].budget));
  if (p.allergy.length) s += t('sumAllergy', p.allergy.map(a=>tx(ALLERGEN[a])).join('・'));
  return s;
}

function addPlan(p){
  const id = 'pl'+Date.now(); S.plans[id] = p;
  const json = JSON.stringify({
    intent:'plan_gifts',
    groups:p.groups.map(g=>({name:g.name.ja, count:g.count, budget_per_person_krw:g.budget, formality:['casual','normal','formal'][g.formal-1]})),
    avoid_allergens:p.allergy, storage:'room'
  }, null, 2);
  const d=document.createElement('div'); d.className='plan';
  d.innerHTML = `<h4>${t('planTitle')}</h4>
    ${p.groups.map(g=>`<div class="g"><span class="e" style="background:${g.color}">${g.e}</span>${tx(g.name)} · ${t('person',g.count)}<b>${t('upTo',won(g.budget))}</b></div>`).join('')}

    <div class="guar">${t('guar').map(x=>`<span>${x}</span>`).join('')}</div>
    <button class="btn coral" data-apply="${id}">${t('planBtn')}</button>
    <button class="json-t" data-json="${id}">${t('jsonShow')}</button>
    <pre id="${id}-json"></pre><p class="note">${t('jsonNote')}</p>`;
  d.querySelector('pre').textContent = json;
  $('#chatLog').appendChild(d); scrollChat();

async function chatSend(text){
  if (S.chatBusy) return; S.chatBusy = true;
  $$('#chatLog .chat-sugs').forEach(x=>x.remove());
  addMe(text); setThinking(true);
  const typing = botRow('<div class="typing"><span></span><span></span><span></span></div>');
  typing.querySelector('.bb').style.padding='0';
  await sleep(900 + Math.random()*600); typing.remove();
  const p = parseRequest(text);
  if (p.groups.length){ await streamBot(t('replyPlan', summarize(p))); addPlan(p); }
  else if (/渡|マナー|건네|매너|예절/.test(text)) await streamBot(t('replyManner'));
  else if (/ありがと|고마|감사/.test(text)) await streamBot(t('replyThanks'));
  else { await streamBot(t('replyAsk')); addSugs(); }
  setThinking(false); S.chatBusy = false;
}
render.chat = async ()=>{
  const pending = S.chatPending; S.chatPending = null;
  if (!S.chatInit){ S.chatInit = true; await streamBot(t('chatHello'), !!pending); if (!pending) addSugs(); }
  if (pending) chatSend(pending);
  else setTimeout(()=>$('#chatInput').focus({preventScroll:true}), 400);
};

      <div class="seg" data-formal="${g.id}"><i class="knob"></i>${t('formal').map((f,i)=>`<button class="${g.formal===i+1?'on':''}" data-fv="${i+1}">${f}</button>`).join('')}</div>
    </div>`).join('');
  stagger($('#groupList'), anim);
  requestAnimationFrame(()=>$$('#groupList .seg').forEach(s=>moveKnob(s)));
  if (bumpKey){ const o = $(`[data-out="${bumpKey}"]`); o && o.classList.add('bump'); }
  countUp($('#peopleSum'), peopleTotal(), v=>t('person', Math.round(v)), 400);
  countUp($('#budgetSum'), budgetTotal(), won, 400);
};
$('#groupList').addEventListener('click', e=>{
  const inc = e.target.closest('[data-inc]'), fb = e.target.closest('[data-fv]'), del = e.target.closest('[data-del]');
  if (inc){
    const [id,k,d]=inc.dataset.inc.split('|'); const g=S.groups.find(x=>x.id==id);
    g[k] = Math.min(k==='count'?99:100000, Math.max(k==='count'?1:500, g[k] + +d));
    markDirty(); render.people({anim:false}, `${id}|${k}`);
  }
  if (fb){
    const seg = fb.closest('.seg'), g = S.groups.find(x=>x.id==seg.dataset.formal);
    g.formal = +fb.dataset.fv; markDirty();
    seg.querySelectorAll('button').forEach(b=>b.classList.toggle('on', b===fb)); moveKnob(seg);
  }
  if (del){
    if (S.groups.length===1) return toast(t('needOne'));
    const card = del.closest('.group'); card.classList.add('leaving');
    setTimeout(()=>{ S.groups = S.groups.filter(x=>x.id!=del.dataset.del); markDirty(); render.people({anim:false}); }, 260);
  }
});

/* add-group sheet */
function openSheet(){
  $('#presetGrid').innerHTML = PRESETS.map((p,i)=>`<button data-preset="${i}"><span class="e" style="background:${p.color}">${p.e}</span>${tx(p.name)}</button>`).join('');
  $('#backdrop').classList.add('show'); $('#sheet').classList.add('show');
}
function closeSheet(){ $('#backdrop').classList.remove('show'); $('#sheet').classList.remove('show'); }
$('#addGroup').onclick = openSheet;
$('#backdrop').onclick = closeSheet;
$('#presetGrid').addEventListener('click', e=>{
  const b = e.target.closest('[data-preset]'); if (!b) return;
  const p = PRESETS[b.dataset.preset], id = Date.now();
  S.groups.push({id, name:p.name, e:p.e, color:p.color, count:3, budget:3000, formal:p.formal});
  markDirty(); closeSheet(); render.people({anim:false});
  const card = $(`[data-gid="${id}"]`); card.classList.add('pop-in'); card.scrollIntoView({behavior:'smooth',block:'center'});

render.cond = ({anim}={})=>{
  $('#shelfHint').textContent = t('shelfHint', daysUntilReturn());
  $$('.seg[data-key]').forEach(seg=>{
    seg.querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.v===S[seg.dataset.key]));
    requestAnimationFrame(()=>moveKnob(seg));
  });
  stagger($('#condBody'), anim);
};
$$('.seg[data-key]').forEach(seg=>seg.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  seg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); moveKnob(seg);
  S[seg.dataset.key]=b.dataset.v; markDirty();
}));
$$('[data-multi]').forEach(box=>box.addEventListener('click',e=>{
  const b=e.target.closest('.chip'); if(!b) return; b.classList.toggle('on');
  S[box.dataset.multi] = [...box.querySelectorAll('.chip.on')].map(x=>x.dataset.v); markDirty();
}));
const rd = new Date(Date.now()+3*864e5); $('#returnDate').value = rd.toISOString().slice(0,10); S.returnDate = $('#returnDate').value;
$('#returnDate').onchange = e=>{ S.returnDate=e.target.value; markDirty(); render.cond(); };

render.result = ({anim, from}={})=>{
  if (anim && (S.dirty || from==='cond' || !S.recs)) return runLoader();
  if (S.dirty || !S.recs) recommend();
  drawResults(anim);
};
function runLoader(){
  const token = S.loadToken = (S.loadToken||0)+1;
  S.loading = true; updateCta('result');
  $('#resultBody').style.display='none'; $('#loader').classList.add('show');
  $('#loadSteps').innerHTML = t('loadSteps').map(s=>`<li><span class="s"></span>${s}</li>`).join('');
  const lis = $$('#loadSteps li');
  lis.forEach((li,i)=>{
    setTimeout(()=>{ li.classList.add('run'); }, i*520);
    setTimeout(()=>{ li.classList.remove('run'); li.classList.add('done'); }, i*520+480);
  });
  setTimeout(()=>{
    if (token!==S.loadToken || S.cur!=='result') return;
    recommend(); S.loading = false;
    $('#loader').classList.remove('show'); $('#resultBody').style.display='';
    drawResults(true); updateCta('result');
  }, lis.length*520+250);
}
function drawResults(anim){
  $('#recList').innerHTML = S.recs.map(r=>{
    const head = `<div class="head" style="background:${r.g.color}"><span>${r.g.e} ${tx(r.g.name)} · ${t('person',r.g.count)}</span><span>${t('upTo',won(r.g.budget))}</span></div>`;
    if (!r.p) return `<div class="card rec">${head}<div class="empty">${t('noMatch')}</div></div>`;
    return `<div class="card rec">${head}
      <button class="heart ${S.fav.has(r.p.id)?'on':''}" data-fav="${r.p.id}">♥</button>
      <div class="body"><div class="pic">${r.p.e}</div>
        <div><div class="pname">${pname(r.p)}</div><div class="alt-name">${paltname(r.p)}</div>
        <div class="tags">${r.p.tags.map(k=>`<span>${tx(TAG[k])}</span>`).join('')}${r.p.wrap?`<span>${tx(TAG.wrap)}</span>`:''}</div></div></div>
      <div class="calc"><span>${won(r.p.price)} × ${r.qty}${t('packs')}<br><small>${t('pcs', r.qty*r.p.pack)}${r.spare?t('spare',r.spare):''}</small></span><b>${won(r.sub)}</b></div>
      <div class="why"><b>${t('why')}</b>　${reasonFor(r.p,r.g)}</div>
      ${r.alts.length>1?`<div class="alt">${r.alts.filter(a=>a.id!==r.p.id).slice(0,3).map(a=>`<button data-pick="${r.g.id}|${a.id}">${a.e} ${pname(a)}${t('swapTo')}</button>`).join('')}</div>`:''}
    </div>`;
  }).join('');
  stagger($('#recList'), anim);
  const total = S.recs.reduce((a,r)=>a+r.sub,0), b = budgetTotal(), pct = Math.min(100, total/b*100), over = total>b;
  $('#totalBox').innerHTML = S.recs.filter(r=>r.p).map(r=>`<div class="line"><span>${r.g.e} ${tx(r.g.name)}</span><span>${won(r.sub)}</span></div>`).join('') +
    `<div class="big"><span>${t('sum')} <small style="color:var(--ink-3)">≈ ${yen(total)}</small></span><b id="totalNum" data-val="${anim?0:total}">${won(total)}</b></div>
     <div class="bar"><i id="totalBar" style="background:${over?'var(--coral-deep)':'var(--coral)'};width:${anim?0:pct}%"></i></div>
     <div class="line" style="margin-top:8px"><span>${t('budgetLine',won(b))}</span><span style="color:${over?'var(--coral-deep)':'inherit'}">${over?t('over',won(total-b)):t('left',won(b-total))}</span></div>`;
  if (anim){ countUp($('#totalNum'), total, won, 900); setTimeout(()=>$('#totalBar').style.width = pct+'%', 50); }
}
$('#recList').addEventListener('click',e=>{
  const h=e.target.closest('[data-fav]'); if (h) return toggleFav(h.dataset.fav, h);
  const p=e.target.closest('[data-pick]'); if(!p) return;
  const [gid,pid]=p.dataset.pick.split('|'); S.picks[gid]=pid; recommend(); drawResults(false);
  const idx = S.groups.findIndex(g=>g.id==gid); const nc = $$('#recList .rec')[idx]; nc && nc.classList.add('swap');
  toast(t('swapped'));
});
function toggleFav(id, btn){
  const on = !S.fav.has(id); on ? S.fav.add(id) : S.fav.delete(id);
  btn.classList.toggle('on', on); btn.classList.remove('pop'); void btn.offsetWidth; btn.classList.add('pop');
  toast(on ? t('favAdd') : t('favDel'));
}

render.map = ({anim}={})=>{
  if (S.dirty || !S.recs) recommend();
  const need = new Set(S.recs.filter(r=>r.p).flatMap(r=>r.p.stores.filter(s=>S.store.includes(s))));
  const list = STORES.filter(s=>need.has(s.t));
  $('#pins').innerHTML = list.map((s,i)=>`<div class="pin ${anim?'drop':''}" data-pin="${s.t}" style="left:${s.x}%;top:${s.y}%;--i:${i}"><span>${STORE_META[s.t].e} ${s.dist}</span><i style="background:${STORE_META[s.t].c}"></i></div>`).join('');
  $('#storeList').innerHTML = list.map(s=>{
    const items = S.recs.filter(r=>r.p&&r.p.stores.includes(s.t)).map(r=>pname(r.p)).join('・');
    return `<div class="store" data-store="${s.t}"><div class="ico" style="background:${STORE_META[s.t].c}">${STORE_META[s.t].e}</div><div><b>${tx(s.name)}</b><p>${items}</p></div><span class="dist">${s.dist} ›</span></div>`;
  }).join('') || `<div class="empty">${t('noStore')}</div>`;
  stagger($('#storeList'), anim);
  drawPhrase(false);
};
function drawPhrase(animate){
  const recs = S.recs.filter(r=>r.p);
  if (S.phraseIdx >= recs.length) S.phraseIdx = 0;
  $('#phraseTabs').innerHTML = recs.map((r,i)=>`<button class="chip ${i===S.phraseIdx?'on':''}" data-ph="${i}">${r.p.e} ${tx(r.g.name)}</button>`).join('');
  const r = recs[S.phraseIdx]; if (!r) return;
  const name = r.p.ko.replace(/\s*\(.*\)/,''), n = r.qty;
  const cnt = n<=20 ? `${NATIVE[n]} 개` : `${n}개`, y = n<=20 ? `${YOMI[n]} ゲ` : `${n} ゲ`;
  $('#phraseKr').textContent = `${name} ${cnt} 주세요.`;
  $('#phraseYomi').innerHTML = `<span>${t('reading')}: …${y} チュセヨ</span><button data-say="${name} ${cnt} 주세요">🔊 ${t('listen')}</button>`;
  $('#phraseJa').textContent = L==='ja' ? `${t('meaning')}：「${r.p.ja}を${n}つください」` : `${t('meaning')}: ${r.p.ko.replace(/\s*\(.*\)/,'')} ${n}개 주세요 (日本語:「${r.p.ja}を${n}つください」)`;
  if (animate){ const c=$('#phraseCard'); c.classList.remove('swap'); void c.offsetWidth; c.classList.add('swap'); }
}
$('#phraseTabs').addEventListener('click',e=>{ const b=e.target.closest('[data-ph]'); if(b){ S.phraseIdx=+b.dataset.ph; drawPhrase(true); }});
$('#storeList').addEventListener('click',e=>{
  const s=e.target.closest('[data-store]'); if(!s) return;
  $$('.store').forEach(x=>x.classList.toggle('on', x===s));
  $$('.pin').forEach(p=>p.classList.toggle('hl', p.dataset.pin===s.dataset.store));
  const st = STORES.find(x=>x.t===s.dataset.store); toast(t('routeToast', tx(st.name)));
  const idx = S.recs.filter(r=>r.p).findIndex(r=>r.p.stores.includes(st.t));
  if (idx>=0 && idx!==S.phraseIdx){ S.phraseIdx=idx; drawPhrase(true); }
});

render.message = ({anim}={})=>{
  if (S.msgGroup >= S.groups.length) S.msgGroup = 0;
  $('#msgTabs').innerHTML = S.groups.map((g,i)=>`<button class="chip ${i===S.msgGroup?'on':''}" data-mg="${i}">${g.e} ${tx(g.name)}</button>`).join('');
  const g = S.groups[S.msgGroup], arr = MSGS[g.formal], m = arr[S.msgIdx % arr.length];
  $('#msgText').innerHTML = m.ja; $('#msgMean').textContent = `${t('meaning')}: ${m.ko}`;
  $('#msgFrom').textContent = `${t('to', tx(g.name))} · ${t('formal')[g.formal-1]}`;
  if (anim) stagger($('#msgTabs'), true);
};
function flipMsg(){ const c=$('#msgCard'); c.classList.remove('flip'); void c.offsetWidth; c.classList.add('flip'); setTimeout(()=>render.message({anim:false}), 250); }
$('#msgTabs').addEventListener('click',e=>{ const b=e.target.closest('[data-mg]'); if(b){ S.msgGroup=+b.dataset.mg; S.msgIdx=0; $$('#msgTabs .chip').forEach(c=>c.classList.toggle('on',c===b)); flipMsg(); }});
$('#nextMsg').onclick = ()=>{ S.msgIdx++; flipMsg(); };
$('#sayMsg').onclick = e=>speak($('#msgText').innerText, 'ja-JP', e.currentTarget);
$('#copyMsg').onclick = ()=>{
  const txt=$('#msgText').innerText;
  if (!navigator.clipboard) return toast(t('copyFail'));
  navigator.clipboard.writeText(txt).then(()=>toast(t('copied')),()=>toast(t('copyFail')));
};

render.list = ({anim}={}, justChecked)=>{
  if (S.dirty || !S.recs) recommend();
  const recs = S.recs.filter(r=>r.p);
  $('#checkList').innerHTML = recs.map(r=>{
    const st = r.p.stores.find(s=>S.store.includes(s)) || r.p.stores[0];
    return `<div class="check ${S.checked[r.g.id]?'done':''}" data-ck="${r.g.id}">
      <div class="box">✓</div><div><div class="t">${r.p.e} ${pname(r.p)} × ${r.qty}</div><p>${tx(r.g.name)} · ${tx(STORE_META[st])}</p></div>
      <span class="amt">${won(r.sub)}</span></div>`;
  }).join('') || `<div class="empty">${t('listEmpty')}</div>`;
  if (anim) stagger($('#checkList'), true);
  const b = budgetTotal(), doneRecs = recs.filter(r=>S.checked[r.g.id]), spent = doneRecs.reduce((a,r)=>a+r.sub,0);
  countUp($('#remain'), b-spent, won, 600);
  $('#remainSub').textContent = t('bought', doneRecs.length, recs.length, won(spent));
  $('#ringArc').setAttribute('stroke-dasharray', `${Math.min(100,spent/b*100)} 100`);
  const all = recs.length && doneRecs.length===recs.length;
  $('#doneCard').classList.toggle('show', !!all);
  return all;
};
$('#checkList').addEventListener('click',e=>{
  const c=e.target.closest('[data-ck]'); if(!c) return;
  S.checked[c.dataset.ck]=!S.checked[c.dataset.ck];
  const all = render.list({anim:false}, true);
  const nb = $(`[data-ck="${c.dataset.ck}"] .box`); nb && nb.classList.add('bump');
  if (all && S.checked[c.dataset.ck]) confetti();
});

/* ================= 土産話 QR (mock only) ================= */
(function drawQR(){ // decorative fake QR
  let h = 2166136261; for (const c of 'omiyage-8f2k1x') h = Math.imul(h ^ c.charCodeAt(0), 16777619) >>> 0;
  const bit = () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; h >>>= 0; return h & 1; };
  const N = 25, inF = (x,y) => (x<8&&y<8) || (x>N-9&&y<8) || (x<8&&y>N-9);
  const F = (x,y) => `<rect x="${x}" y="${y}" width="7" height="7" fill="#2B2522"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3" fill="#2B2522"/>`;
  let m = ''; for (let y=0;y<N;y++) for (let x=0;x<N;x++) if (!inF(x,y) && bit()) m += `<rect x="${x}" y="${y}" width="1" height="1" fill="#2B2522"/>`;
  $('#qrBox').innerHTML = `<svg viewBox="-1 -1 ${N+2} ${N+2}" shape-rendering="crispEdges"><rect x="-1" y="-1" width="${N+2}" height="${N+2}" fill="#fff"/>${m}${F(0,0)}${F(N-7,0)}${F(0,N-7)}</svg>`;
})();
