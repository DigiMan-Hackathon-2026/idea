<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SubStamp GO</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3F3B35">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SubStamp">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=M+PLUS+Rounded+1c:wght@500;800&family=Noto+Sans+KR:wght@500;700&family=Jua&display=swap" rel="stylesheet">
<style>
/* SubStamp GO v2 — casual sticker style on Seoul colors
   cream ← 삼베연미색 #DCCCAC · cocoa ← 기와진회색 #504E48 · sky ← 서울하늘색 #558BCF
   ok ← 남산초록색 #345F53 · ng ← 단청빨간색 #AE1932 · yolk ← 은행노란색 #F6B65A */
:root{
  --cream:#F6EFDF; --paper:#FFFBF2; --sand:#EADFC6; --sand-2:#DCCCAC;
  --cocoa:#3F3B35; --cocoa-2:#504E48;
  --ink:#2B2925; --ink-2:#55514A; --ink-3:#7C776E; --line:#2B2925;
  --sky:#558BCF; --sky-d:#3E6FAF; --sky-soft:#DCE8F6; --sky-1:#C3D7EF; --sky-2:#8FB3E0;
  --ok:#345F53; --ok-soft:#DCE8E1;
  --ng:#AE1932; --ng-soft:#F6DFE2;
  --warn:#F6B65A; --warn-soft:#FCEBCB;
  --l1:#0052A4; --l2:#00A84D; --l4:#00A5DE; --l6:#CD7C2F;
  --r-lg:26px; --r-md:20px;
  --pop:0 3px 0 var(--line);
  --font:"M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", system-ui, sans-serif;
  --disp:"Fredoka", "M PLUS Rounded 1c", sans-serif;
  --ko:"Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
  --spring:cubic-bezier(.34,1.56,.64,1);
  /* compatibility with older names used in JS/markup */
  --bg:var(--cream); --silver:var(--sand);
}
html[lang="ko"]{ --font:"Noto Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif; }
html[lang="ko"] .h2, html[lang="ko"] .hero h1, html[lang="ko"] .verdict h2, html[lang="ko"] .bubble{font-family:"Jua", var(--ko);font-weight:400}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#E9DFC9;background-image:radial-gradient(#D9CBAE 1.2px,transparent 1.3px);background-size:22px 22px;
  font-family:var(--font);color:var(--ink);display:flex;align-items:center;justify-content:center;gap:56px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

.side{max-width:290px}
.side h1{font-family:var(--disp);font-size:52px;line-height:1;margin-bottom:14px;color:var(--cocoa);font-weight:600}
.side h1 span{color:var(--sky-d)}
.side p{color:var(--ink-2);font-size:15px;line-height:1.8}
.swatches{margin-top:22px;display:grid;gap:8px}
.sw{display:flex;align-items:center;gap:10px;font-size:13px}
.sw i{width:26px;height:26px;border-radius:9px;flex:none;border:1.5px solid var(--line)}
.sw small{margin-left:auto;color:var(--ink-3);font-family:ui-monospace,monospace}
@media (max-width:860px){.side{display:none}}

.phone{width:390px;height:min(844px, calc(100dvh - 32px));min-height:560px;flex:none;background:var(--cream);border-radius:52px;border:10px solid #2A2724;
  box-shadow:0 30px 70px rgba(60,45,25,.28);position:relative;overflow:hidden;display:flex;flex-direction:column;transition:background .3s}
.notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:120px;height:32px;background:#2A2724;border-radius:20px;z-index:40}
@media (max-width:500px){body{display:block;background:var(--cream)}.phone{width:100%;height:100dvh;border:0;border-radius:0;box-shadow:none}.notch{display:none}}
.statusbar{height:52px;flex:none;display:flex;justify-content:space-between;align-items:flex-end;padding:0 18px 6px 30px;font-size:14px;font-weight:800;position:relative;z-index:12;font-family:var(--disp);transition:background .3s,color .3s}
.statusbar.dark{background:var(--cocoa);color:var(--cream)}
.lang{position:relative;display:flex;background:var(--paper);border-radius:99px;padding:3px;border:1.5px solid var(--line)}
.lang button{position:relative;z-index:1;font-size:12px;font-weight:800;padding:4px 10px;border-radius:99px;color:var(--ink-3);transition:color .2s}
.lang button.on{color:var(--cream)}
.lang .knob{position:absolute;top:3px;bottom:3px;border-radius:99px;background:var(--cocoa);transition:left .35s var(--spring),width .35s var(--spring)}
.screens{flex:1;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;overflow-y:auto;padding:6px 18px 118px;display:none;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.screen.active{display:block}
.screen.go-fwd{animation:slideL .42s cubic-bezier(.2,.8,.2,1)}
.screen.go-back{animation:slideR .42s cubic-bezier(.2,.8,.2,1)}
.screen.fade-lang{animation:fadeLang .35s ease}
@keyframes slideL{from{opacity:0;transform:translateX(36px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:0;transform:translateX(-36px)}to{opacity:1;transform:none}}
@keyframes fadeLang{from{opacity:.2;filter:blur(2px)}to{opacity:1;filter:none}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
@keyframes wiggle{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.stagger > *{animation:rise .5s var(--spring) both;animation-delay:calc(var(--i,0) * 70ms)}

/* wavy cocoa header band */
.hero{margin:-6px -18px 0;padding:6px 22px 54px;background:var(--cocoa);color:var(--cream);position:relative}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:30px;background:var(--cream);
  -webkit-mask:radial-gradient(18px 16px at 50% 0,#0000 98%,#000) 0 0/36px 30px repeat-x;
          mask:radial-gradient(18px 16px at 50% 0,#0000 98%,#000) 0 0/36px 30px repeat-x}
.hero .appbar{padding-bottom:4px}
.hero h1{font-family:var(--disp);font-weight:600;font-size:30px;line-height:1.15}
.hero p{font-size:15px;opacity:.8;margin-top:4px;line-height:1.5}
.hero .iconbtn{background:rgba(255,251,242,.12);border-color:rgba(255,251,242,.5);color:var(--cream);box-shadow:none}

/* common */
.appbar{display:flex;align-items:center;justify-content:space-between;min-height:56px;padding:4px 0 10px}
.brand{display:flex;align-items:center;gap:6px;font-family:var(--disp);font-weight:600;font-size:22px;letter-spacing:.01em}
.brand b{color:var(--warn);font-weight:600}
.iconbtn{width:44px;height:44px;border-radius:50%;background:var(--paper);border:1.5px solid var(--line);box-shadow:var(--pop);display:grid;place-items:center;transition:transform .2s var(--spring)}
.iconbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.iconbtn svg{width:22px;height:22px}
.ttl{font-size:17px;font-weight:800;color:var(--ink)}
.h2{font-size:24px;font-weight:800;line-height:1.35}
.sub{font-size:15px;color:var(--ink-2);margin-top:6px;line-height:1.6}
.label{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800;color:var(--ink);margin:24px 0 10px}
.label::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--warn);border:1.5px solid var(--line)}
.label .more{margin-left:auto;font-size:13px;color:var(--ink-3);font-weight:700}
.card{background:var(--paper);border-radius:var(--r-md);border:1.5px solid var(--line);padding:18px}
.demo-tag{display:inline-flex;align-items:center;gap:6px;background:var(--warn);color:var(--ink);font-size:12px;font-weight:800;padding:4px 10px;border-radius:99px;white-space:nowrap;border:1.5px solid var(--line)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:64px;border-radius:22px;background:var(--cocoa);color:var(--cream);font-size:19px;font-weight:800;border:1.5px solid var(--line);box-shadow:0 4px 0 var(--line);transition:transform .15s,box-shadow .15s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn svg{width:26px;height:26px}
.btn.sky{background:var(--sky);color:#fff}
.btn.ghost{background:var(--paper);color:var(--ink);min-height:56px;font-size:17px}
.badge{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 6px;border-radius:99px;color:#fff;font-size:13px;font-weight:800;font-family:var(--disp)}
.b1{background:var(--l1)}.b2{background:var(--l2)}.b4{background:var(--l4)}.b6{background:var(--l6)}.bA{background:#0090D2}.bK{background:#77C4A3}
.ko{font-family:var(--ko)}
.seg{display:flex;background:var(--sand);border-radius:99px;padding:4px;gap:4px;border:1.5px solid var(--line)}
.seg button{flex:1;min-height:38px;border-radius:99px;font-size:13px;font-weight:800;color:var(--ink-2);transition:background .2s,color .2s}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.demo-switch{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.demo-switch .seg{flex:1}

/* nav — cocoa pill like a habit app */
.nav{position:absolute;left:14px;right:14px;bottom:14px;height:70px;background:var(--cocoa);border-radius:28px;display:flex;justify-content:space-around;align-items:center;z-index:9;box-shadow:0 10px 24px rgba(60,45,25,.25);padding:0 6px}
.nav{transition:transform .35s var(--spring),opacity .25s}.nav.hide{transform:translateY(130%);opacity:0;pointer-events:none}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:800;color:rgba(246,239,223,.6);padding:6px 0;border-radius:20px;transition:color .2s}
.nav svg{width:24px;height:24px;transition:transform .3s var(--spring)}
.nav button.on{color:var(--cream)}
.nav button.on svg{color:var(--warn);transform:translateY(-2px) scale(1.12)}

/* mascot */
.m svg{display:block;width:100%;height:auto;overflow:visible}
.m .bob{animation:bob 2.6s ease-in-out infinite;transform-origin:60px 110px}
.m .eye{animation:blink 4s infinite;transform-box:fill-box;transform-origin:center}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-5px) rotate(2deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}

/* home */
.home-hero{padding-bottom:70px}
.home-hero .say{display:flex;align-items:flex-end;gap:10px;margin-top:6px}
.home-hero .say .m{width:104px;flex:none;margin-bottom:-58px;position:relative;z-index:2}
.bubble{background:var(--paper);color:var(--ink);border-radius:22px 22px 22px 6px;padding:13px 16px;border:1.5px solid var(--line);font-size:17px;font-weight:800;line-height:1.5;animation:popIn .5s var(--spring) both .2s;margin-bottom:8px}
.route{position:relative;padding:4px 18px;margin-top:6px}
.field{display:flex;align-items:center;gap:12px;padding:14px 0;width:100%;text-align:left}
.field + .field{border-top:1.5px dashed var(--sand-2)}
.field .dot{width:18px;height:18px;border-radius:50%;flex:none;border:4px solid var(--sky);background:var(--paper)}
.field .dot.to{background:var(--ng);border-color:var(--ng)}
.field small{display:block;font-size:12px;color:var(--ink-3);font-weight:800}
.field b{display:block;font-size:22px;margin-top:2px;font-weight:800}
.field .yomi{font-size:13px;color:var(--ink-2);font-weight:500}
.field .lines{margin-left:auto;margin-right:52px;display:flex;gap:4px}
.swap{position:absolute;right:16px;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;background:var(--warn);border:1.5px solid var(--line);display:grid;place-items:center;transition:transform .3s var(--spring)}
.swap:active{transform:translateY(-50%) rotate(180deg)}
.swap svg{width:20px;height:20px}
.stack{display:grid;gap:12px;margin-top:16px}
.week{display:flex;align-items:center;gap:14px;width:100%;text-align:left}
.week .days{display:flex;gap:6px;flex:1}
.week .d{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;font-weight:800;color:var(--ink-3)}
.week .d i{width:30px;height:30px;border-radius:11px;border:1.5px solid var(--line);background:var(--paper);display:grid;place-items:center}
.week .d.on i{background:var(--sky)}
.week .d.on i::after{content:"";width:12px;height:7px;border:solid #fff;border-width:0 0 2.5px 2.5px;transform:translateY(-2px) rotate(-45deg)}
.week .d.today{color:var(--ink)}
.week .d.today i{box-shadow:0 0 0 3px var(--warn)}
.streak{display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:12px;border-top:1.5px dashed var(--sand-2);font-size:14px;font-weight:800;color:var(--ink-2)}
.streak b{font-family:var(--disp);font-size:26px;color:var(--ink);font-weight:600}
.streak .go{margin-left:auto;color:var(--sky-d)}
.mini-stamps{display:flex;align-items:center;gap:10px;width:100%;text-align:left}
.mini-stamps .st{width:54px;height:54px;border-radius:50%;border:2.5px dashed var(--ng);display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--ng);transform:rotate(-8deg);background:var(--paper);flex:none}
.mini-stamps .st:nth-child(2){transform:rotate(6deg);border-color:var(--sky-d);color:var(--sky-d)}
.mini-stamps .st:nth-child(3){transform:rotate(-3deg);border-color:var(--ok);color:var(--ok)}
.mini-stamps .ms-txt{font-size:14px;color:var(--ink-2);line-height:1.5;margin-left:auto;text-align:right}
.mini-stamps .ms-txt b{font-family:var(--disp);font-size:24px;color:var(--ink);font-weight:600}

/* sheet */
.backdrop{position:absolute;inset:0;background:rgba(43,41,37,.45);opacity:0;pointer-events:none;transition:opacity .3s;z-index:20}
.backdrop.show{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:80%;overflow-y:auto;background:var(--cream);border-radius:30px 30px 0 0;border-top:1.5px solid var(--line);padding:12px 18px 30px;transform:translateY(105%);visibility:hidden;transition:transform .45s var(--spring),visibility 0s .45s;z-index:21}
.sheet.show{transform:none;visibility:visible;transition:transform .45s var(--spring)}
.grab{width:44px;height:5px;border-radius:99px;background:var(--sand-2);margin:0 auto 14px}
.search{display:flex;align-items:center;gap:10px;background:var(--paper);border-radius:18px;padding:14px 16px;border:1.5px solid var(--line);font-size:16px;color:var(--ink-3)}
.search svg{width:22px;height:22px}
.st-row{display:flex;align-items:center;gap:12px;width:100%;padding:16px 4px;border-bottom:1.5px dashed var(--sand-2);text-align:left}
.st-row b{font-size:19px;display:block}
.st-row small{font-size:13px;color:var(--ink-3)}
.st-row .lines{margin-left:auto;display:flex;gap:4px}

/* scan (camera) — cocoa dark */
#scan{background:var(--cocoa);color:var(--cream)}
#scan .iconbtn{background:rgba(255,251,242,.12);border-color:rgba(255,251,242,.5);box-shadow:none;color:var(--cream)}
#scan .ttl{color:var(--cream)}
.viewfinder{position:relative;height:330px;border-radius:28px;overflow:hidden;border:1.5px solid rgba(255,251,242,.35);background:linear-gradient(180deg,#4A4640 0%,#38352F 60%,#5E574D 100%)}
.viewfinder .ceiling{position:absolute;left:0;right:0;top:0;height:60px;background:repeating-linear-gradient(90deg,#55504A 0 40px,#5E5952 40px 42px)}
.viewfinder .lamp{position:absolute;top:14px;left:10%;right:10%;height:8px;border-radius:99px;background:#FFF8E5;box-shadow:0 0 30px 8px rgba(255,248,229,.35)}
.viewfinder .floor{position:absolute;left:-20%;right:-20%;bottom:-40px;height:120px;background:#7E776C;transform:perspective(300px) rotateX(55deg)}
.viewfinder .edge{position:absolute;left:0;right:0;bottom:44px;height:10px;background:repeating-linear-gradient(90deg,var(--warn) 0 18px,#3A3A3A 18px 36px)}
.sign{position:absolute;left:50%;top:92px;transform:translateX(-50%);width:84%;background:#2A2D33;border:3px solid #4A4F57;border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 24px rgba(0,0,0,.4);transition:filter .3s;color:#fff}
.sign .lc{width:40px;height:40px;border-radius:50%;background:var(--l2);display:grid;place-items:center;font-weight:700;font-size:22px;flex:none}
.sign .kr{font-family:var(--ko);font-size:22px;font-weight:700;line-height:1.3}
.sign .en{font-size:12px;opacity:.75;margin-top:2px}
.sign .arrow{margin-left:auto;font-size:30px;font-weight:700}
.viewfinder.blur .sign{filter:blur(4px) brightness(1.3)}
.viewfinder.blur::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 60% 40%,rgba(255,255,255,.55),transparent 40%)}
.corners{position:absolute;inset:70px 18px 90px}
.corners i{position:absolute;width:30px;height:30px;border:5px solid var(--warn);border-radius:10px}
.corners i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0}
.corners i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0}
.corners i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0}
.corners i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0}
.scanline{position:absolute;left:18px;right:18px;height:3px;top:70px;border-radius:3px;background:linear-gradient(90deg,transparent,var(--warn),transparent);box-shadow:0 0 14px var(--warn);animation:scan 2.2s ease-in-out infinite}
@keyframes scan{0%,100%{top:72px}50%{top:228px}}
.read{margin-top:14px;background:rgba(255,251,242,.09);border:1.5px dashed rgba(255,251,242,.3);border-radius:20px;padding:14px 16px;font-size:15px;line-height:1.6}
.read small{display:block;font-size:12px;opacity:.7;font-weight:800}
.read b{font-size:17px}
#scan .seg{background:rgba(255,251,242,.1);border-color:rgba(255,251,242,.3)}
#scan .seg button{color:rgba(246,239,223,.75)}
#scan .seg button.on{background:var(--cream);color:var(--ink);box-shadow:none}
#scan .demo-tag{flex:none}
#cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;background:#000}
.viewfinder.cam{background:#2A2724}
.viewfinder.cam .ceiling,.viewfinder.cam .lamp,.viewfinder.cam .sign,.viewfinder.cam .floor,.viewfinder.cam .edge{display:none}
.viewfinder.cam.live #cam{display:block}
.viewfinder.cam:not(.live) .scanline{display:none}
.cam-msg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:0 34px;font-size:16px;font-weight:800;line-height:1.6;color:rgba(255,251,242,.85)}
.cam-msg.show{display:flex}
.viewfinder:not(.cam) .cam-msg{display:none}
.guide-tip{position:absolute;left:0;right:0;bottom:20px;text-align:center;font-size:13px;font-weight:800;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.6);display:none}
.viewfinder.cam.live .guide-tip{display:block}
.engine{position:absolute;left:12px;top:12px;font-size:12px;font-weight:800;padding:5px 10px;border-radius:99px;background:rgba(0,0,0,.45);color:rgba(255,255,255,.9);display:none}
.engine.vision{background:var(--ok);color:#fff}
.viewfinder.cam .engine{display:block}
.pickimg{cursor:pointer;border:1.5px solid rgba(255,251,242,.45);border-radius:18px;padding:8px 4px}
.flag-tip{margin-top:8px;font-size:12px;line-height:1.55;color:rgba(246,239,223,.6)}
.flag-tip:empty{display:none}
.shutter-row{display:flex;align-items:center;justify-content:space-between;margin-top:18px}
.shutter{width:86px;height:86px;border-radius:50%;border:5px solid var(--cream);display:grid;place-items:center;transition:transform .15s}
.shutter i{width:64px;height:64px;border-radius:50%;background:var(--warn);display:block}
.shutter:active{transform:scale(.9)}
.side-act{width:90px;font-size:13px;font-weight:800;color:var(--cream);opacity:.9;text-align:center;line-height:1.4}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:30}
.flash.go{animation:flash .45s ease-out}
@keyframes flash{0%{opacity:.9}100%{opacity:0}}
.judging{position:absolute;inset:0;background:rgba(43,41,37,.86);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:25;color:var(--cream);font-size:20px;font-weight:800}
.judging.show{display:flex}
.judging .m{width:120px}
.judging .m .bob{animation:jump .7s var(--spring) infinite}
.judging .prog{width:180px;height:8px;border-radius:99px;background:rgba(255,255,255,.2);overflow:hidden;display:none}
.judging .prog i{display:block;height:100%;width:0;background:var(--warn);transition:width .2s}
.judging.loading .prog{display:block}
@keyframes jump{0%,100%{transform:translateY(0)}35%{transform:translateY(-16px)}}

/* result */
.verdict{border-radius:var(--r-lg);padding:22px 20px 24px;color:#fff;position:relative;overflow:hidden;border:1.5px solid var(--line);box-shadow:0 4px 0 var(--line);animation:popIn .5s var(--spring) both}
.verdict.ok{background:var(--ok)}.verdict.ng{background:var(--ng)}.verdict.unk{background:var(--warn);color:var(--ink)}
.verdict::before{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.1)}
.verdict .row{display:flex;align-items:center;gap:14px;position:relative}
.verdict .ic{width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;flex:none;border:1.5px solid rgba(255,255,255,.5)}
.verdict.unk .ic{background:rgba(0,0,0,.08);border-color:rgba(0,0,0,.2)}
.verdict .ic svg{width:34px;height:34px}
.verdict h2{font-size:28px;line-height:1.25;font-weight:800}
.verdict p{font-size:16px;margin-top:12px;line-height:1.6;font-weight:800;padding-right:84px;position:relative}
.verdict .m{position:absolute;right:-6px;bottom:-12px;width:104px}
.verdict .big{font-family:var(--disp);font-size:44px;font-weight:600}
.reason{margin-top:14px}
.reason .tag{font-size:12px;font-weight:800;color:var(--sky-d);background:var(--sky-soft);padding:4px 10px;border-radius:99px;display:inline-block}
.reason p{font-size:17px;line-height:1.8;margin-top:10px}
.reason .signread{margin-top:12px;padding-top:12px;border-top:1.5px dashed var(--sand-2);font-size:14px;color:var(--ink-2);line-height:1.6}
.signread .eng{display:block;margin-top:6px;font-size:12px;opacity:.7}
.safety{display:flex;gap:12px;align-items:flex-start;margin-top:14px;background:var(--warn-soft);border:1.5px solid var(--line);border-radius:var(--r-md);padding:16px;font-size:15px;line-height:1.6;font-weight:800}
.safety svg{width:28px;height:28px;flex:none}
.ask{margin-top:14px;background:var(--cocoa);color:var(--cream);border-radius:var(--r-md);padding:18px;border:1.5px solid var(--line)}
.ask small{font-size:12px;opacity:.7;font-weight:800}
.ask .kr{font-family:var(--ko);font-size:24px;font-weight:700;margin:8px 0 6px;line-height:1.4}
.ask .yomi{font-size:14px;color:var(--warn)}
.manual{display:grid;gap:10px;margin-top:6px}
.dir{display:flex;align-items:center;gap:12px;background:var(--paper);border-radius:var(--r-md);padding:16px;border:1.5px solid var(--line);box-shadow:var(--pop);text-align:left;transition:transform .15s,box-shadow .15s}
.dir:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.dir b{font-size:18px;display:block}
.dir small{font-size:13px;color:var(--ink-3)}
.dir .alt{font-size:13px;color:var(--ink-2)}
.dir svg{width:26px;height:26px;margin-left:auto;flex:none}

/* ride (3D) */
.status{display:flex;align-items:center;gap:10px;border-radius:20px;padding:14px 16px;color:#fff;font-size:17px;font-weight:800;transition:background .3s;border:1.5px solid var(--line)}
.status.ok{background:var(--ok)}.status.ng{background:var(--ng)}
.status svg{width:26px;height:26px;flex:none}
.scene{position:relative;height:330px;margin-top:12px;border-radius:var(--r-lg);overflow:hidden;background:#DCE7F5;border:1.5px solid var(--line)}
.scene canvas{display:block;width:100%;height:100%}
.scene .tag{position:absolute;left:12px;top:12px}
.viewbtn{position:absolute;right:12px;top:10px;background:var(--paper);border:1.5px solid var(--line);border-radius:99px;padding:6px 12px;font-size:12px;font-weight:800}
.hud{position:absolute;left:12px;bottom:12px;background:var(--cocoa);color:var(--cream);border-radius:16px;padding:6px 12px;display:flex;align-items:baseline;gap:4px}
.hud b{font-family:var(--disp);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;min-width:30px;text-align:right}
.hud small{font-size:12px;opacity:.8}
.scene .compass{position:absolute;right:12px;bottom:12px;background:var(--paper);border:1.5px solid var(--line);border-radius:99px;padding:6px 12px;font-size:12px;font-weight:800;border-left:6px solid var(--l2)}
.arr-banner{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.8);background:var(--ok);color:#fff;font-size:21px;font-weight:800;padding:14px 22px;border-radius:20px;border:1.5px solid var(--line);box-shadow:0 4px 0 var(--line);opacity:0;transition:.4s var(--spring);pointer-events:none;white-space:nowrap}
.arr-banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.arr-banner.ng{background:var(--ng)}
.nogl{position:absolute;inset:0;display:none;place-items:center;font-size:15px;line-height:1.7;font-weight:800;color:var(--ink-2);padding:24px;text-align:center;background:var(--sky-soft)}
.nogl.show{display:grid}
.next{display:flex;align-items:center;gap:14px;margin-top:14px}
.next .lbl{font-size:13px;color:var(--ink-3);font-weight:800}
.next b{font-size:32px;display:block;line-height:1.1;font-weight:800}
.next .yomi{font-size:14px;color:var(--ink-2)}
.next .eta{margin-left:auto;text-align:right;flex:none}
.next .eta b{font-family:var(--disp);font-size:30px;color:var(--sky-d);font-weight:600}
.stops{list-style:none;margin-top:14px;position:relative;padding-left:8px}
.stops::before{content:"";position:absolute;left:19px;top:16px;bottom:16px;width:6px;border-radius:3px;background:var(--sand)}
.stops li{position:relative;display:flex;align-items:center;gap:14px;padding:9px 0;font-size:17px}
.stops li i{width:28px;height:28px;border-radius:50%;background:var(--paper);border:5px solid var(--sand);flex:none;z-index:1}
.stops li.done{color:var(--ink-3)}
.stops li.done i{border-color:var(--l2);background:var(--l2)}
.stops li.now b{font-size:20px}
.stops li.now i{border-color:var(--l2);box-shadow:0 0 0 6px rgba(0,168,77,.2);animation:pulse 1.4s ease-in-out infinite}
.stops li.goal i{border-color:var(--ng)}
.stops li small{font-size:13px;color:var(--ink-3);margin-left:auto}
@keyframes pulse{50%{box-shadow:0 0 0 12px rgba(0,168,77,0)}}

/* arrive */
#arrive{background:radial-gradient(circle at 50% 30%,var(--warn-soft) 0,var(--cream) 55%)}
.arr-head{text-align:center;margin-top:4px}
.arr-head small{font-size:14px;color:var(--ink-2);font-weight:800}
.arr-head h2{font-size:30px;margin-top:4px;font-weight:800}
.arr-head h2 span{font-size:19px;color:var(--ink-2)}
.stampwrap{display:grid;place-items:center;height:210px;position:relative}
.stamp{width:180px;height:180px;border-radius:50%;border:6px double var(--ng);color:var(--ng);display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--paper);transform:rotate(-10deg)}
.stamp.hit{animation:stampHit .6s cubic-bezier(.2,1.4,.4,1) both}
@keyframes stampHit{0%{opacity:0;transform:scale(2.2) rotate(-25deg)}60%{opacity:1;transform:scale(.92) rotate(-8deg)}100%{transform:scale(1) rotate(-10deg)}}
.stamp .no{font-family:var(--disp);font-size:13px;font-weight:600;letter-spacing:.1em}
.stamp b{font-size:34px;line-height:1.1;margin:4px 0}
.stamp .alt{font-size:16px;font-weight:800}
.stamp .date{font-family:var(--disp);font-size:13px;margin-top:6px;font-weight:600}
.ring-burst{position:absolute;width:180px;height:180px;border-radius:50%;border:4px solid var(--ng);opacity:0}
.ring-burst.go{animation:burst .8s ease-out .35s}
@keyframes burst{0%{opacity:.6;transform:scale(1)}100%{opacity:0;transform:scale(1.6)}}
.charcard{display:flex;gap:14px;align-items:center;margin-top:6px;background:var(--paper);border-radius:var(--r-lg);padding:16px;border:1.5px solid var(--line);box-shadow:var(--pop);animation:rise .6s var(--spring) both .7s}
.charcard .m{width:100px;flex:none;background:var(--warn-soft);border-radius:22px;padding:6px;border:1.5px solid var(--line)}
.charcard small{font-size:12px;color:var(--ink-3);font-weight:800}
.charcard b{font-size:22px;display:block;margin:2px 0 4px}
.charcard .stars{color:var(--warn);font-size:18px;letter-spacing:2px;-webkit-text-stroke:1px var(--line)}
.story{margin-top:12px;animation:rise .6s var(--spring) both .85s}
.story h3{font-size:16px;margin-bottom:8px}
.story p{font-size:16px;line-height:1.85}
.story .src{font-size:12px;color:var(--ink-3);margin-top:10px;line-height:1.5}

/* stats */
.month{display:flex;align-items:center;gap:10px;margin-top:10px}
.month b{font-family:var(--disp);font-weight:600;font-size:18px}
.month button{width:32px;height:32px;border-radius:50%;border:1.5px solid rgba(255,251,242,.5);display:grid;place-items:center;color:var(--cream)}
.month button svg{width:16px;height:16px}
.month button:disabled{opacity:.35}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:2px;position:relative;z-index:2}
.tile{background:var(--paper);border:1.5px solid var(--line);border-radius:22px;padding:14px 14px 12px;box-shadow:var(--pop);display:flex;flex-direction:column;gap:2px;min-height:108px}
.tile small{font-size:12px;font-weight:800;color:var(--ink-2)}
.tile .v{font-family:var(--disp);font-size:38px;font-weight:600;line-height:1.05;display:flex;align-items:baseline;gap:3px}
.tile .v span{font-family:var(--font);font-size:14px;font-weight:800;color:var(--ink-2)}
.tile .d{font-size:12px;color:var(--ink-3);font-weight:700;margin-top:auto}
.tile .d.up{color:var(--ok)}
.tile.sky{background:var(--sky-soft)}.tile.yolk{background:var(--warn-soft)}.tile.sage{background:var(--ok-soft)}
.cal{margin-top:6px}
.cal .head,.cal .body{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .head span{text-align:center;font-size:11px;font-weight:800;color:var(--ink-3);padding-bottom:6px}
.cal .c{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-family:var(--disp);font-size:13px;font-weight:500;position:relative;cursor:default;transition:transform .15s}
.cal .c.n0{background:var(--sand);color:var(--ink-2)}
.cal .c.n1{background:var(--sky-1)}
.cal .c.n2{background:var(--sky-2)}
.cal .c.n3{background:var(--sky-d);color:#fff}
.cal .c.fut{background:transparent;color:var(--sand-2);border:1.5px dashed var(--sand-2)}
.cal .c.today{box-shadow:0 0 0 2.5px var(--line)}
.cal .c.sd::after{content:"";position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:50%;background:var(--ng);border:1.5px solid var(--paper)}
.cal .c:not(.fut):hover{transform:scale(1.12)}
.cal .c.blank{visibility:hidden}
.legend{display:flex;align-items:center;gap:6px;margin-top:12px;font-size:11px;font-weight:800;color:var(--ink-3)}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}
.legend .gap{margin-left:auto;display:flex;align-items:center;gap:6px}
.legend .dot{width:10px;height:10px;border-radius:50%;background:var(--ng)}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;margin-top:8px;padding:0 2px;border-bottom:1.5px solid var(--sand-2)}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative}
.bars .b i{width:100%;max-width:26px;border-radius:8px 8px 3px 3px;background:var(--sky-1);height:0;transition:height .8s cubic-bezier(.2,.8,.2,1)}
.bars .b.top i{background:var(--sky-d)}
.bars .b em{font-style:normal;font-family:var(--disp);font-size:13px;font-weight:600;color:var(--ink);position:absolute;opacity:0;transition:opacity .2s;pointer-events:none}
.bars .b.top em,.bars .b:hover em{opacity:1}
.bars-x{display:flex;gap:10px;padding:6px 2px 0}
.bars-x span{flex:1;text-align:center;font-size:11px;font-weight:800;color:var(--ink-3)}
.rank{display:grid;gap:12px;margin-top:4px}
.rank .r{display:grid;grid-template-columns:24px 1fr auto;align-items:center;gap:10px}
.rank .r .no{font-family:var(--disp);font-weight:600;font-size:16px;color:var(--ink-3);text-align:center}
.rank .r b{font-size:15px;display:flex;align-items:center;gap:6px}
.rank .r .track{grid-column:2/4;height:10px;border-radius:99px;background:var(--sand);overflow:hidden;margin-top:-4px}
.rank .r .track i{display:block;height:100%;border-radius:99px;background:var(--sky);width:0;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.rank .r .n{font-family:var(--disp);font-weight:600;font-size:15px}
.tip{position:absolute;z-index:31;background:var(--cocoa);color:var(--cream);font-size:13px;font-weight:800;padding:7px 11px;border-radius:12px;pointer-events:none;opacity:0;transform:translate(-50%,-100%) translateY(-6px);transition:opacity .15s;white-space:nowrap}
.tip.show{opacity:1}
.insight{display:flex;gap:12px;align-items:center;margin-top:14px;background:var(--ok-soft)}
.insight .m{width:64px;flex:none}
.insight p{font-size:14px;line-height:1.6;font-weight:700}

/* collect */
.coll-top{display:flex;align-items:center;gap:16px;margin-top:-6px;position:relative;z-index:2}
.ring{width:108px;height:108px;flex:none;position:relative;background:var(--paper);border-radius:50%;border:1.5px solid var(--line);box-shadow:var(--pop)}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10}
.ring .bg{stroke:var(--sand)}
.ring .fg{stroke:var(--l2);stroke-linecap:round;transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:var(--disp);font-weight:600;font-size:26px;line-height:1}
.ring .lbl small{display:block;font-size:12px;color:var(--ink-3);font-family:var(--font);font-weight:800;margin-top:2px}
.coll-top .sub{margin:0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.cell{background:var(--paper);border-radius:22px;padding:10px 8px 12px;border:1.5px solid var(--line);box-shadow:var(--pop);text-align:center}
.cell .m{width:70px;margin:0 auto}
.cell b{font-size:14px;display:block;margin-top:4px}
.cell small{font-size:11px;color:var(--ink-3);font-weight:700}
.cell.new{background:var(--warn-soft);position:relative}
.cell.new::after{content:"NEW";position:absolute;top:-9px;right:-4px;background:var(--ng);color:#fff;font-family:var(--disp);font-size:11px;font-weight:600;padding:3px 8px;border-radius:99px;border:1.5px solid var(--line);animation:wiggle 1.6s ease-in-out infinite}
.cell.lock{background:transparent;box-shadow:none;border-style:dashed;border-color:var(--sand-2)}
.cell.lock .q{width:70px;height:70px;margin:0 auto;border-radius:50%;background:var(--sand);display:grid;place-items:center;font-family:var(--disp);font-size:30px;font-weight:600;color:var(--paper)}
.cell.lock b{color:var(--ink-3)}

.toast{position:absolute;left:50%;bottom:104px;transform:translateX(-50%) translateY(20px);background:var(--cocoa);color:var(--cream);padding:12px 18px;border-radius:99px;font-size:15px;font-weight:800;opacity:0;transition:.3s var(--spring);z-index:30;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
.hero .ttl{color:var(--cream)}
</style>
</head>
<body>

<aside class="side">
  <h1>SubStamp <span>GO</span></h1>
  <p data-i="sideDesc"></p>
  <div class="swatches">
    <div class="sw"><i style="background:#DCCCAC"></i>삼베연미색 · <span data-i="swBase"></span><small>#DCCCAC</small></div>
    <div class="sw"><i style="background:#504E48"></i>기와진회색 · <span data-i="swDark"></span><small>#504E48</small></div>
    <div class="sw"><i style="background:#558BCF"></i>서울하늘색 · <span data-i="swMain"></span><small>#558BCF</small></div>
    <div class="sw"><i style="background:#345F53"></i>남산초록색 · <span data-i="segOk"></span><small>#345F53</small></div>
    <div class="sw"><i style="background:#AE1932"></i>단청빨간색 · <span data-i="segNg"></span><small>#AE1932</small></div>
    <div class="sw"><i style="background:#F6B65A"></i>은행노란색 · <span data-i="swAccent"></span><small>#F6B65A</small></div>
  </div>
</aside>

<div class="phone" id="phone">
  <div class="notch"></div>
  <div class="statusbar" id="statusbar"><span>9:41</span>
    <div class="lang" id="lang"><i class="knob"></i><button data-lang="ja">日本語</button><button data-lang="ko">한국어</button></div></div>
  <div class="screens">

  <!-- ============ HOME ============ -->
  <section class="screen" id="home">
    <div class="hero home-hero">
      <div class="appbar"><div class="brand">SubStamp <b>GO</b></div><span class="demo-tag" data-i="demo"></span></div>
      <div class="say"><div class="m" data-m="smile"></div><div class="bubble" data-i="greet"></div></div>
    </div>
    <div id="homeBody">
      <div class="card route">
        <button class="field" data-sheet="from"><span class="dot"></span><span><small data-i="fromL"></small><b id="fromName"></b><span class="yomi" id="fromSub"></span></span><span class="lines" id="fromLines"></span></button>
        <button class="field" data-sheet="to"><span class="dot to"></span><span><small data-i="toL"></small><b id="toName"></b><span class="yomi" id="toSub"></span></span><span class="lines" id="toLines"></span></button>
        <button class="swap" id="swapBtn" aria-label="swap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M7 20l-3-3M7 20l3-3M17 20V4M17 4l-3 3M17 4l3 3"/></svg></button>
      </div>
      <div class="stack">
        <button class="btn sky" data-go="scan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span data-i="scanBtn"></span></button>
        <button class="btn ghost" data-manual data-i="manualBtn"></button>
      </div>
      <p class="label"><span data-i="weekL"></span></p>
      <button class="card" data-go="stats" style="width:100%;text-align:left;display:block">
        <div class="week"><div class="days" id="weekDays"></div></div>
        <div class="streak"><span data-i="streakL"></span><b id="streakN"></b><span data-i="unitDays"></span><span class="go" data-i="seeStats"></span></div>
      </button>
      <p class="label"><span data-i="stampsL"></span></p>
      <button class="card mini-stamps" data-go="collect">
        <span class="st" data-sn="shindorim"></span><span class="st" data-sn="hapjeong"></span><span class="st" data-sn="myeongdong"></span>
        <span class="ms-txt" data-i="stampsN"></span>
      </button>
    </div>
  </section>

  <!-- ============ SCAN ============ -->
  <section class="screen" id="scan">
    <div class="appbar"><button class="iconbtn" data-go="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button><span class="ttl" data-i="scanTtl"></span><span style="width:44px"></span></div>
    <div class="demo-switch"><span class="demo-tag" data-i="demoShow"></span>
      <div class="seg" id="signSeg"><button data-v="cam" class="on" data-i="signCam"></button><button data-v="ok" data-i="signOk"></button><button data-v="ng" data-i="signNg"></button><button data-v="unk" data-i="signUnk"></button></div></div>
    <div class="viewfinder" id="vf">
      <div class="ceiling"></div><div class="lamp"></div>
      <div class="sign"><span class="lc">2</span><div><div class="kr" id="signKr"></div><div class="en" id="signEn"></div></div><span class="arrow">→</span></div>
      <div class="floor"></div><div class="edge"></div>
      <video id="cam" playsinline muted autoplay></video>
      <div class="cam-msg" id="camMsg"></div>
      <div class="corners"><i></i><i></i><i></i><i></i></div>
      <div class="scanline"></div>
      <div class="guide-tip" data-i="guideTip"></div>
      <span class="engine" id="engine"></span>
    </div>
    <div class="read"><small data-i="readL"></small><b id="readTxt"></b><br><span id="readTr"></span></div>
    <div class="flag-tip" id="flagTip"></div>
    <div class="shutter-row">

const ORDER = ['home','scan','result','ride','arrive','stats','collect'];

function stagger(el, on=true){ el.classList.remove('stagger'); if (!on) return; void el.offsetWidth; [...el.children].forEach((c,i)=>c.style.setProperty('--i',i)); el.classList.add('stagger'); }
function go(id){
  const prev = S.cur; if (prev===id) return; S.cur = id;
  if (id !== 'ride') stop3D();
  if (id !== 'scan') OCR.stop();
  const dir = !prev || ORDER.indexOf(id) >= ORDER.indexOf(prev) ? 'go-fwd' : 'go-back';
  $$('.screen').forEach(s=>s.classList.remove('active','go-fwd','go-back','fade-lang'));
  const el = $('#'+id); void el.offsetWidth; el.classList.add('active', dir); el.scrollTop = 0;
  $$('.nav button').forEach(b=>b.classList.toggle('on', b.dataset.tab===TAB[id]));
  $('#statusbar').classList.toggle('dark', ['home','scan','stats','collect'].includes(id));
  $('.nav').classList.toggle('hide', id==='scan');
  render[id] && render[id](true);
}
document.addEventListener('click', e=>{
  const g = e.target.closest('[data-go]'); if (g) return go(g.dataset.go);
  const tb = e.target.closest('[data-tab]'); if (tb) return go(tb.dataset.tab);
  if (e.target.closest('[data-manual]')){ S.sign='unk'; S.ocr=null; return go('result'); }
  const sh = e.target.closest('[data-sheet]'); if (sh) return openSheet(sh.dataset.sheet);
});

};

const ENG_KEY = {vision:'engVision', os:'engOS', tess:'engTess'};
const esc = x => String(x).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function drawEngine(){
  const e = await OCR.pickEngine();
  const el = $('#engine'); el.className = 'engine ' + e; el.textContent = t(ENG_KEY[e]);
  // only worth telling Apple users how to turn Vision on
  $('#flagTip').textContent = e === 'tess' && /iPhone|iPad|iPod/.test(navigator.userAgent) ? t('flagTip') : '';
}
function drawSign(){
  const cam = S.scanMode === 'cam', tr = I[L].SIGN;
  $$('#signSeg button').forEach(b=>b.classList.toggle('on', b.dataset.v===S.scanMode));
  $('#vf').classList.toggle('cam', cam);
  drawEngine(); OCR.refreshMsg();
  if (cam){
    $('#vf').classList.remove('blur');
    $('#readTxt').textContent = t('camHint'); $('#readTr').textContent = '';
    OCR.start(); return;
  }
  OCR.stop();
  const s = SIGNS[S.scanMode];
  $('#signKr').textContent = s.kr; $('#signEn').textContent = s.en;
  $('#readTxt').textContent = s.read || tr.unkRead; $('#readTr').textContent = tr[S.scanMode];
  $('#vf').classList.toggle('blur', S.scanMode==='unk');
}
$('#signSeg').addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b) return; S.scanMode=b.dataset.v; drawSign(); });

function showJudging(on){
  const j = $('#judging'); j.classList.toggle('show', on); j.classList.remove('loading');
  $('#judgeTxt').textContent = t('judging'); $('#progBar2').style.width = '0';
}
function onProgress(status, p){
  const j = $('#judging');
  if (status === 'recognizing text'){ j.classList.add('loading'); $('#judgeTxt').textContent = t('reading'); }
  else if (/load|initializ/.test(status)){ j.classList.add('loading'); $('#judgeTxt').textContent = t('loadingModel'); }
  $('#progBar2').style.width = Math.round((p||0)*100) + '%';
}
function toast(msg){ const el=$('#toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('show'),2200); }
async function runOcr(job){
  showJudging(true);
  try {
    const r = await job();
    if (!r) throw new Error('no frame');
    S.sign = r.verdict; S.ocr = r.text; S.ocrEngine = r.engine;
    if (r.firstPass != null) console.info('[OCR] TextDetector pass:', r.firstPass);
  } catch(err){
    console.warn(err); S.sign = 'unk'; S.ocr = ''; S.ocrEngine = null; toast(t('ocrFail'));
  }
  showJudging(false); go('result');
}
$('#shutter').onclick = ()=>{
  const f=$('#flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
  if (S.scanMode === 'cam'){
    if (!OCR.live) return $('#pickFile').click();   // no camera → fall back to a photo
    return runOcr(()=>OCR.shoot(onProgress));
  }
  S.sign = S.scanMode; S.ocr = null;
  $('#judging').classList.add('show');
  setTimeout(()=>{ $('#judging').classList.remove('show'); go('result'); }, 1300);
};
$('#pickFile').addEventListener('change', e=>{
  const file = e.target.files && e.target.files[0]; e.target.value = '';
  if (file) runOcr(()=>OCR.fromFile(file, onProgress));
});

function drawResult(anim=true){
  const r = I[L].RES[S.sign], alt = L==='ja' ? 'ko' : 'ja';

  const read = S.ocr == null ? r.read
    : `${t('ocrRead')}${S.ocr ? esc(S.ocr) : t('ocrNone')}${S.ocrEngine ? `<small class="eng">${t('ocrBy', t(ENG_KEY[S.ocrEngine]))}</small>` : ''}`;
  if (S.sign !== 'unk') h += `<div class="card reason"><span class="tag">${t('aiTag')}</span><p>${r.reason}</p><div class="signread">${read}</div></div>`;
  else if (S.ocr != null) h += `<div class="card reason"><div class="signread">${read}</div></div>`;
  if (S.sign !== 'ok') h += `<div class="safety">${ICON.warn}<span>${t('safety')}</span></div>`;

    h += `<p class="label">${t('pickL')}</p><div class="manual">

  }
  if (S.sign !== 'ok') h += `<div class="ask"><small>${t('askL')}</small><div class="kr">홍대입구 가려면<br>어느 쪽이에요?</div><div class="yomi">${t('askSub')}</div></div>`;

    : `<div class="stack"><button class="btn ghost" data-go="scan">${t('retry')}</button></div>`;
  $('#resBody').innerHTML = h; paintMascots($('#resBody')); stagger($('#resBody'), anim);
}

  makeLabels(); updateRideUI(true); start3D();
};
$('#rideSeg').addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b) return; S.ride=b.dataset.v;
  $$('#rideSeg button').forEach(x=>x.classList.toggle('on', x===b));
  if (R.inited){ setMode(S.ride); }
});
$('#viewBtn').onclick = ()=>{ R.view = R.view==='follow' ? 'overview' : 'follow'; updateRideUI(true); };
window.addEventListener('resize', resize3D);

/* ================= arrive ================= */
render.arrive = anim=>{
  if (!anim) return;
  const s=$('#stamp'), b=$('#burst');
  [s,b].forEach(x=>x.classList.remove('hit','go')); void s.offsetWidth;
  s.classList.add('hit'); b.classList.add('go');
};

/* ================= collect ================= */
const CELLS = [
  {k:'hapjeong',m:'clam',c:'charName',isNew:true},{k:'shindorim',m:'smile',c:'chikapo'},{k:'myeongdong',m:'happy',c:'chikapo'},
  {k:'mullae'},{k:'dangsan'},{k:'hongdae'},{k:'sinchon'},{k:'ewha'},{k:'cityhall'},
];
render.collect = anim=>{
  $('#grid').innerHTML = CELLS.map(c=> c.m
    ? `<div class="cell ${c.isNew?'new':''}"><div class="m" data-m="${c.m}"></div><b>${sName(c.k)}</b><small>${t(c.c)}</small></div>`
    : `<div class="cell lock"><div class="q">?</div><b>${sName(c.k)}</b><small>${t('locked')}</small></div>`).join('');
  paintMascots($('#grid')); stagger($('#grid'), anim);
  const fg=$('#ringFg'), C=2*Math.PI*42; fg.style.strokeDasharray=C;
  if (anim){ fg.style.strokeDashoffset=C; setTimeout(()=>fg.style.strokeDashoffset=C*(1-3/12),120); } else fg.style.strokeDashoffset=C*(1-3/12);
};


/* ================= stats (demo data) ================= */
const TODAY = new Date(2026, 10, 23);           // demo "today"
const RIDES = [0,1,2,0,1,0,0,2,1,0,3,1,0,0,1,2,0,2,1,3,2,1,2];   // rides per day, Nov 1-23
const STAMP_DAYS = [8, 15, 23];
const LAST_MONTH = 21, JUDGE = {ok:17, all:18}, BEST_STREAK = 6;
const FAV = [['shindorim',9],['hongdae',7],['hapjeong',5],['myeongdong',3]];
const dowMon = d => (d.getDay() + 6) % 7;      // 0 = Monday
function streak(){ let n = 0; for (let i = RIDES.length - 1; i >= 0 && RIDES[i] > 0; i--) n++; return n; }
const tier = n => n >= 3 ? 3 : n;

render.home = anim=>{
  const days = [];
  for (let k = 6; k >= 0; k--){
    const d = new Date(TODAY); d.setDate(d.getDate() - k);
    const n = RIDES[d.getDate() - 1] || 0;
    days.push(`<span class="d ${n?'on':''} ${k===0?'today':''}"><i></i>${t('dows')[dowMon(d)]}</span>`);
  }
  $('#weekDays').innerHTML = days.join('');
  $('#streakN').textContent = streak();
  stagger($('#homeBody'), anim);
};

render.stats = anim=>{
  const total = RIDES.reduce((a,b)=>a+b,0), st = streak();
  $('#monthLbl').textContent = t('month', TODAY.getFullYear(), TODAY.getMonth()+1);
  $('#tiles').innerHTML = `
    <div class="tile sky"><small>${t('tRides')}</small><div class="v">${total}<span>${t('uTimes')}</span></div><div class="d up">${t('vsLast', total-LAST_MONTH)}</div></div>
    <div class="tile sage"><small>${t('tOk')}</small><div class="v">${Math.round(JUDGE.ok/JUDGE.all*100)}<span>%</span></div><div class="d">${t('okOf', JUDGE.ok, JUDGE.all)}</div></div>
    <div class="tile yolk"><small>${t('tStamps')}</small><div class="v">3<span>/ 12</span></div><div class="d">${t('stampsOf')}</div></div>
    <div class="tile"><small>${t('tStreak')}</small><div class="v">${st}<span>${t('uDays')}</span></div><div class="d">${t('best', BEST_STREAK)}</div></div>`;

  // calendar heatmap (Monday first)
  const y = TODAY.getFullYear(), m = TODAY.getMonth(), first = new Date(y, m, 1), dim = new Date(y, m+1, 0).getDate();
  $('#calHead').innerHTML = t('dows').map(w=>`<span>${w}</span>`).join('');
  let cells = '<span class="c blank"></span>'.repeat(dowMon(first));
  for (let d = 1; d <= dim; d++){
    if (d > TODAY.getDate()){ cells += `<span class="c fut">${d}</span>`; continue; }
    const n = RIDES[d-1] || 0;
    cells += `<span class="c n${tier(n)} ${d===TODAY.getDate()?'today':''} ${STAMP_DAYS.includes(d)?'sd':''}" data-tip="${t('tipDay', m+1, d, n)}">${d}</span>`;
  }
  $('#calBody').innerHTML = cells;

  // rides by weekday
  const byDow = [0,0,0,0,0,0,0];
  RIDES.forEach((n,i)=>{ byDow[dowMon(new Date(y, m, i+1))] += n; });
  const max = Math.max(...byDow), top = byDow.indexOf(max);
  $('#bars').innerHTML = byDow.map((n,i)=>`<div class="b ${i===top?'top':''}" data-tip="${t('tipDow', t('dows')[i], n)}"><em style="bottom:calc(${n/max*100}% + 4px)">${n}</em><i data-h="${Math.max(4, n/max*100)}"></i></div>`).join('');
  $('#barsX').innerHTML = t('dows').map(w=>`<span>${w}</span>`).join('');

  const fmax = FAV[0][1];
  $('#rank').innerHTML = FAV.map(([k,n],i)=>`<div class="r"><span class="no">${i+1}</span><b>${sName(k)} ${(ST[k].lines||[]).slice(0,2).map(badge).join('')}</b><span class="n">${n}${t('uTimes')}</span><div class="track"><i data-w="${n/fmax*100}"></i></div></div>`).join('');
  $('#insight').innerHTML = t('insight', t('dows')[top]);

  const grow = ()=>{ $$('#bars i').forEach(e=>e.style.height=e.dataset.h+'%'); $$('#rank .track i').forEach(e=>e.style.width=e.dataset.w+'%'); };
  if (anim){ $$('#bars i').forEach(e=>e.style.height='0'); $$('#rank .track i').forEach(e=>e.style.width='0'); setTimeout(grow, 250); } else grow();
  paintMascots($('#statsBody')); stagger($('#statsBody'), anim);
};

/* hover / tap tooltip for chart marks */
(function(){
  const tip = $('#tip'), phone = $('#phone');
  const show = el=>{
    const r = el.getBoundingClientRect(), p = phone.getBoundingClientRect();
    tip.textContent = el.dataset.tip;
    tip.style.left = (r.left - p.left + r.width/2) + 'px'; tip.style.top = (r.top - p.top) + 'px';
    tip.classList.add('show');
  };
  phone.addEventListener('pointerover', e=>{ const el = e.target.closest('[data-tip]'); if (el) show(el); });
  phone.addEventListener('pointerout', e=>{ if (e.target.closest('[data-tip]')) tip.classList.remove('show'); });
  phone.addEventListener('scroll', ()=>tip.classList.remove('show'), true);
})();


/* ================= boot ================= */
applyI18n();
const startAt = location.hash.slice(1);
go(ORDER.includes(startAt) ? startAt : 'home');
window.addEventListener('resize', moveKnob);
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
